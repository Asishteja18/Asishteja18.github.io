sked, it raises an <strong>exception<\/strong> and stops. The traceback that prints is not a telling-off, it is a report, and the last line is the part you read: a type and a message. The type is the useful half, because each type is a different problem with a different fix.<\/p>\n<ul>\n<li><code>FileNotFoundError<\/code> -- the path is wrong, or you are running from a different folder than you think.<\/li>\n<li><code>ValueError<\/code> -- the value was the wrong shape for the operation: <code>float(\"\")<\/code>, <code>int(\"19.5\")<\/code>.<\/li>\n<li><code>KeyError<\/code> / <code>IndexError<\/code> -- you asked for a key or a position that is not there.<\/li>\n<li><code>TypeError<\/code> -- the operation does not apply to that kind of thing at all: <code>None + 1<\/code>.<\/li>\n<li><code>ZeroDivisionError<\/code> -- usually an average of an empty list.<\/li>\n<\/ul>\n<p><code>try<\/code> and <code>except<\/code> let you carry on. Put the risky line in the <code>try<\/code> block and what to do about it in the <code>except<\/code> block, naming the one error you expect. Keep the <code>try<\/code> block as short as you can: one risky line, so that when it fires you know precisely which operation failed.<\/p>"}, {"type": "code", "code": "text = \"\"\n\ntry:\n    value = float(text)\nexcept ValueError:\n    print(\"that was not a number\")\n\n# Different problems, different handling\ntry:\n    with open(\"missing.txt\") as f:\n        rows = f.read().splitlines()\nexcept FileNotFoundError:\n    print(\"no such file -- check the path\")\n    rows = []\n\n# You can look at the error object itself\ntry:\n    value = float(\"abc\")\nexcept ValueError as err:\n    print(\"could not read it:\", err)", "caption": "except names the error you are prepared for. Everything else still stops the script, as it should."}, {"type": "callout", "kind": "warn", "title": "A bare except is a trap you set for yourself", "body": "except: with no error type, and except Exception: pass, catch everything -- including the typo in a variable name (NameError), the Ctrl-C you pressed to stop the script (KeyboardInterrupt) and the bug you have not found yet. Your code then carries on with wrong data and no message, and you can lose an hour to a misspelled variable that a traceback would have pointed straight at. Catch the specific error you expect. If you deliberately skip bad rows, count them and say how many at the end: 'skipped 37 of 40,000 rows' is information, silence is not."}, {"type": "code", "code": "lines = [\"19.5\", \"\", \"20.1\", \"n/a\", \"18.7\"]\n\nnumbers = []\nskipped = 0\n\nfor line_no, line in enumerate(lines, start=1):\n    try:\n        numbers.append(float(line))\n    except ValueError:\n        skipped = skipped + 1\n        print(f\"line {line_no}: cannot read {line!r}, skipping\")\n\nprint(numbers)                              # [19.5, 20.1, 18.7]\nprint(f\"skipped {skipped} of {len(lines)} rows\")\n\nif numbers:                                 # never divide by zero\n    print(f\"mean {sum(numbers) / len(numbers):.2f}\")\nelse:\n    print(\"no usable readings\")", "caption": "The whole pattern: read, skip what you cannot use, count it, report it."}], "exercise": {"brief": "Write a function named parse_floats that takes a list of strings, one per line of a file, and returns a list of floats containing only the lines that could be converted. Lines that cannot be converted are skipped, not substituted. An empty list, a list where nothing converts, and a line of \"0\" must all behave sensibly.", "starter": "def parse_floats(lines):\n    out = []\n    for line in lines:\n        out.append(float(line))\n    return out\n", "solution": "def parse_floats(lines):\n    out = []\n    for line in lines:\n        try:\n            out.append(float(line))\n        except ValueError:\n            pass          # a line we cannot read is a line we skip\n    return out\n", "tests": [{"label": "converts good lines", "expr": "parse_floats([\"1\", \"2.5\"]) == [1.0, 2.5]"}, {"label": "skips blanks and words", "expr": "parse_floats([\"1\", \"\", \"n/a\", \"3\"]) == [1.0, 3.0]"}, {"label": "empty list", "expr": "parse_floats([]) == []"}, {"label": "nothing usable", "expr": "parse_floats([\"abc\", \"\"]) == []"}, {"label": "zero is kept, not skipped", "expr": "parse_floats([\"0\"]) == [0.0]"}, {"label": "surrounding spaces are fine", "expr": "parse_floats([\" 4.5 \"]) == [4.5]"}]}}, {"id": "py-intro", "track": "python", "order": 1, "title": "Start here", "blurb": "The whole road ahead, and how each stop works, before you write a line.", "minutes": 8, "section": "Introduction", "objectives": ["Know every stop on the map and why it is in that order", "Know what a challenge asks of you and how it is marked", "Run Python in your browser and pass your first test"], "sections": [{"type": "prose", "html": "<p>There is nothing to install and nothing to watch. Every stop on this map is a short read followed by one challenge, and the challenge is the point. You write a function, you press <strong>Run tests<\/strong>, and a list of checks either goes green or stays grey.<\/p><p>That is deliberate. You are never left wondering whether you understood something. The tests either pass or they do not, and the failing one names the case you missed.<\/p>"}, {"type": "callout", "kind": "tip", "title": "Nothing to install", "body": "A full Python interpreter loads inside this page the first time you open a challenge. It takes a few seconds on first visit, then runs entirely on your own machine. Nothing you type is sent anywhere."}, {"type": "prose", "html": "<p><strong>The road ahead.<\/strong> Ten stops, roughly two hours of reading plus however long the challenges take you. They are grouped, and the grouping is the reason for the order.<\/p><ul><li><strong>Stops 1-2, orientation.<\/strong> This page, then what Python actually is and why machine learning ended up using it.<\/li><li><strong>Stops 3-5, the shapes data arrives in.<\/strong> Values and types, then strings, then lists. Most real data is messy text pretending to be numbers, and this is where you learn to tell the difference.<\/li><li><strong>Stops 6-7, doing something to all of it.<\/strong> Loops and comprehensions, then conditionals and the quiet trap where a sensor reading of zero gets treated as missing.<\/li><li><strong>Stops 8-10, structure and the real world.<\/strong> Functions, dictionaries and sets, then files and the errors they throw at row nine thousand.<\/li><\/ul><p>Nothing here is filler. Every stop exists because skipping it causes a specific, predictable problem later.<\/p>"}, {"type": "prose", "html": "<p><strong>After Python.<\/strong> Two more parts are written and waiting, locked until this map is done.<\/p><ul><li><strong>How machine learning actually works<\/strong>, eight stops. A model is a function with numbers you can tune; loss tells it when it is wrong; gradient descent makes it less wrong. You build each piece by hand.<\/li><li><strong>Build your own AI<\/strong>, six stops. A neural network that learns, in under sixty lines, written by you, then an honest account of what separates those lines from a large language model.<\/li><\/ul><p>They are locked because they do not work without the Python. Not as a gimmick: the exercises assume you can already write a loop without thinking about it.<\/p>"}, {"type": "callout", "kind": "warn", "title": "Three things that decide whether this works", "body": "Getting stuck is the work, not a sign you are failing; ten minutes with a failing test teaches more than reading a correct answer. Show solution is there and it costs you something, because you cannot un-see an answer. And the order matters, because each stop assumes the ones before it."}, {"type": "code", "caption": "Every challenge has this shape: a function to finish, and tests that check it.", "code": "def first_run(name):\n    # your code here\n    return \"\"\n\n# the tests then check things like:\n#   first_run(\"Asish\") == \"Hello, Asish. You are running Python.\"\n#   first_run(\"\") still returns a string instead of crashing"}], "exercise": {"brief": "Write a function named first_run that takes a name and returns the string \"Hello, NAME. You are running Python.\" with NAME replaced by whatever was passed in. An empty name should still produce a string, not an error.", "starter": "def first_run(name):\n    # your code here\n    return \"\"\n", "solution": "def first_run(name):\n    return \"Hello, \" + name + \". You are running Python.\"\n", "tests": [{"label": "exact wording", "expr": "first_run(\"Asish\") == \"Hello, Asish. You are running Python.\""}, {"label": "works for a different name", "expr": "first_run(\"Priya\") == \"Hello, Priya. You are running Python.\""}, {"label": "the name actually appears", "expr": "\"Priya\" in first_run(\"Priya\")"}, {"label": "empty name does not crash", "expr": "first_run(\"\") == \"Hello, . You are running Python.\""}]}}, {"id": "py-what", "track": "python", "order": 2, "title": "What Python actually is", "blurb": "A program that reads your instructions one line at a time and remembers what happened.", "minutes": 9, "section": "Introduction", "objectives": ["Say what an interpreter does, in your own words", "Explain why machine learning settled on Python", "Predict which line of a program runs first"], "sections": [{"type": "prose", "html": "<p>Python is a program. You give it a text file of instructions, it reads the first line, does what it says, then reads the next one. That is most of it.<\/p><p>This is called an <strong>interpreter<\/strong>, and it is why you can type one line and see a result immediately, with no build step and no waiting. Languages like C work differently: a compiler reads the whole program first and turns it into machine instructions before anything runs. That makes C faster and Python far quicker to experiment in.<\/p>"}, {"type": "code", "caption": "Top to bottom, and it remembers as it goes.", "code": "readings = 3          # line 1 runs first\nreadings = readings + 1   # line 2 uses what line 1 left behind\nprint(readings)       # line 3 prints 4"}, {"type": "prose", "html": "<p>So why did machine learning end up here, rather than in something faster?<\/p><p>Because the slow part is not the language. The heavy arithmetic in a real model runs inside libraries written in C and Fortran; Python is the layer you use to arrange those pieces and look at the results. You get code that reads almost like a description of what you meant, sitting on top of numerical code that was tuned decades ago.<\/p><p>The other reason is duller and more decisive: everyone else is here. Every paper, tutorial and library you will want assumes Python, and that pull is stronger than any language feature.<\/p>"}, {"type": "callout", "kind": "warn", "title": "Python is slow where it counts", "body": "A loop over a million numbers written in plain Python is slow. You will feel this later, and the answer is never to write a cleverer loop. It is to hand the whole array to a library that does the loop in C. That is the entire reason numpy exists."}, {"type": "prose", "html": "<p>One last thing about reading top to bottom: the order is not a detail. A variable does not exist until the line that creates it has run, and most confusing errors a beginner hits are really about something being used before it was made.<\/p>"}], "exercise": {"brief": "Write a function named runs_first that takes a list of instruction lines and returns the one Python would run first. If the list is empty, return None rather than crashing.", "starter": "def runs_first(lines):\n    # your code here\n    return lines\n", "solution": "def runs_first(lines):\n    if not lines:\n        return None\n    return lines[0]\n", "tests": [{"label": "picks the first of three", "expr": "runs_first([\"a = 1\", \"b = 2\", \"print(b)\"]) == \"a = 1\""}, {"label": "a single line is the first line", "expr": "runs_first([\"print(1)\"]) == \"print(1)\""}, {"label": "empty list returns None", "expr": "runs_first([]) is None"}, {"label": "does not read from the end", "expr": "runs_first([\"first\", \"last\"]) != \"last\""}, {"label": "returns the line, not the whole list", "expr": "runs_first([\"only\"]) != [\"only\"]"}]}}, {"id": "ml-01", "track": "ml", "order": 1, "title": "What a model actually is", "blurb": "Take the word 'model' away and you are left with a function and two numbers you are allowed to change.", "minutes": 13, "objectives": ["Write a model as a Python function with parameters you can change", "Tell a parameter apart from an input, and say why the difference matters", "State what the word learning means in terms of those numbers"], "sections": [{"type": "prose", "html": "<p>Someone sends you a spreadsheet: sixty rows, two columns. The average outdoor temperature for a day, and the kilowatt-hours the building used that day. Tomorrow is forecast at 8 degrees, and they want a number by lunchtime.<\/p>\n<p>Put machine learning aside for a moment. What you need is a rule that turns 8 into a number of kilowatt-hours. Here is one: multiply the temperature by -14, then add 420. At 8 degrees that gives 308. Nobody can stop you writing that down, and in Python it is two lines.<\/p>\n<p>That rule is a model. Not a simplified version of one, not an analogy for one -- that is what the word means. A model is a function that takes what you know and returns what you want, with a few numbers inside it that the problem does not fix for you. Here those numbers are -14 and 420. Change them and you have a different model of the same shape.<\/p>"}, {"type": "code", "code": "# A model, hard-coded. Nothing here was learned.\ndef predict(temp):\n    return -14 * temp + 420\n\nprint(predict(8))                # 308\n\n# The same model with its numbers pulled out where you can reach them\ndef predict(temp, w, b):\n    return w * temp + b\n\nprint(predict(8, -14, 420))      # 308\nprint(predict(8, -10, 400))      # 320   a different model, same shape\nprint(predict(8, 0, 300))        # 300   w of 0 ignores the temperature entirely", "caption": "A model is a function. The parameters are arguments you happen to keep the same for every row."}, {"type": "prose", "html": "<p>Two kinds of number live in that function and they behave nothing alike. Keeping them straight is most of the battle.<\/p>\n<p>The temperature is an <strong>input<\/strong>. It comes from the world, it is different for every row, and you get no vote on it. The -14 and the 420 are <strong>parameters<\/strong>. They are the same for every row, they came out of your head, and they are yours to change. By convention the multiplier is called <code>w<\/code>, for weight, and the number added on is called <code>b<\/code>, for bias. If you did straight lines at school, they are the slope and the intercept.<\/p>\n<p>So <strong>learning<\/strong> is this, and nothing more mysterious: choosing the parameters. You pick the shape of the function -- a straight line, for now -- and that shape defines a whole family of possible models, one for every setting of <code>w<\/code> and <code>b<\/code>. The data picks which member of the family you walk away with. When you read that some model \"has 7 billion parameters\", that is 7 billion numbers nobody typed in by hand.<\/p>\n<p>Which retires the question of what a model is, and leaves a better one: given the data, how do you search?<\/p>"}, {"type": "code", "code": "temps  = [2, 5, 8, 11, 14]                   # average temperature, degrees\nactual = [395, 350, 300, 265, 220]           # kilowatt-hours that day\n\nfor w in [-10, -14, -18]:\n    print(f\"w = {w}\")\n    for i in range(len(temps)):\n        guess = w * temps[i] + 420\n        print(f\"   {temps[i]:>3} degrees -> predicted {guess:>4}, actual {actual[i]:>4}\")", "caption": "Three candidate models over the same five days. Which one is best? Hold that thought."}, {"type": "callout", "kind": "warn", "title": "Choosing by eye stops working at the second parameter", "body": "With one parameter you can try a few values and squint at the output. With two you are comparing pairs of numbers across five days at once. With ten you cannot hold it in your head, and with a thousand there is nothing to look at. Worse, two people squinting at the same table pick different winners, so the answer is not even reproducible. Everything from here on exists because of this: the next lesson replaces squinting with a single number for how wrong a model is, and the one after turns that number into a direction to move the parameters."}, {"type": "code", "code": "# The shape of the function is your choice. The parameters are what gets searched for.\ndef straight(x, w, b):\n    return w * x + b\n\ndef curved(x, a, w, b):\n    return a * x * x + w * x + b\n\nprint(straight(8, -14, 420))         # 308\nprint(curved(8, 0.5, -14, 420))      # 340.0   same input, different family\n\n# A model with no parameters at all is still a model. Just a very confident one.\ndef always_the_average(x):\n    return 306.0\n\n# Keep this one. Any real model has to beat it, and some do not.\nprint(always_the_average(8))         # 306.0", "caption": "Shape first, then numbers. The no-parameter model is the baseline you measure against."}], "exercise": {"brief": "Write a function named predict_all that takes a list of input numbers and two parameters, w and b, and returns a list of predictions: for each input, w times that input plus b. There should be exactly one prediction per input, an empty list of inputs returns an empty list, and a w of 0 must give the same prediction for every input.", "starter": "def predict_all(xs, w, b):\n    out = []\n    for x in xs:\n        out.append(w * x)      # one of the two parameters is being ignored\n    return out\n", "solution": "def predict_all(xs, w, b):\n    out = []\n    for x in xs:\n        out.append(w * x + b)\n    return out\n", "tests": [{"label": "w times x, plus b", "expr": "(lambda p: len(p) == 3 and abs(p[0] - 1.0) < 1e-9 and abs(p[1] - 3.0) < 1e-9 and abs(p[2] - 5.0) < 1e-9)(predict_all([0, 1, 2], 2, 1))"}, {"label": "no inputs, no predictions", "expr": "predict_all([], 2, 1) == []"}, {"label": "w of zero predicts b every time", "expr": "(lambda p: abs(p[0] - 7.0) < 1e-9 and abs(p[1] - 7.0) < 1e-9)(predict_all([3, 99], 0, 7))"}, {"label": "a negative weight works", "expr": "(lambda p: abs(p[0] + 6.0) < 1e-9)(predict_all([4], -2, 2))"}, {"label": "one prediction per input", "expr": "len(predict_all([1, 2, 3, 4], 1, 1)) == 4"}, {"label": "decimals are fine", "expr": "(lambda p: abs(p[0] - 0.75) < 1e-9)(predict_all([0.5], 0.5, 0.5))"}]}}, {"id": "ml-02", "track": "ml", "order": 2, "title": "Features and labels", "blurb": "The model gets a few numbers per day and no idea what a Saturday is. Deciding which numbers is the job.", "minutes": 14, "objectives": ["Split a problem into features and a label", "Turn categories and messy columns into numbers a model can multiply", "Put features on a common scale, and reuse the same scaling on new data"], "sections": [{"type": "prose", "html": "<p>The spreadsheet has more columns than you used. One of them is <code>day<\/code>, holding Monday, Tuesday, Saturday. Your model multiplies its input by <code>w<\/code>, and multiplying \"Saturday\" by -14 is a TypeError. The world arrived as words, and the model does arithmetic only.<\/p>\n<p>Two names for the two sides of this. The <strong>label<\/strong> is what you are trying to predict: the kilowatt-hours. The <strong>features<\/strong> are the numbers you feed in to predict it. Features are not handed to you by the data. You build them out of whatever the data happens to contain, and that building is where most of the real work lives.<\/p>\n<p>Here is the claim worth taking seriously: on ordinary problems a better feature beats a better model, usually by a wide margin. The straight line from lesson 1 is hopeless at weekends, because the building is shut and uses almost nothing whatever the temperature outside. No amount of cleverer modelling fixes that. One extra feature -- is it a weekend, 1 or 0 -- lets the same dull straight line drop itself down on Saturdays and Sundays, and most of the error disappears. Same model. New feature.<\/p>"}, {"type": "code", "code": "rows = [\n    {\"day\": \"Tuesday\",  \"temp\": 8,  \"kwh\": 300},\n    {\"day\": \"Saturday\", \"temp\": 8,  \"kwh\": 95},\n    {\"day\": \"Friday\",   \"temp\": 14, \"kwh\": 220},\n]\n\nweekend = {\"Saturday\", \"Sunday\"}        # a set, because this is a membership test\n\nfeatures = []\nlabels = []\nfor row in rows:\n    if row[\"day\"] in weekend:\n        is_weekend = 1\n    else:\n        is_weekend = 0\n    features.append([row[\"temp\"], is_weekend])\n    labels.append(row[\"kwh\"])\n\nprint(features)        # [[8, 0], [8, 1], [14, 0]]\nprint(labels)          # [300, 95, 220]\n\n# The first two rows had the same temperature. To the model they are now\n# different days, which is the whole point.", "caption": "Features in one list, labels in another, same order. Keep them side by side or everything after this is wrong."}, {"type": "prose", "html": "<p>Getting everything into numbers is the first half. The ranges those numbers live in are the second.<\/p>\n<p>Say you have floor area in square metres, from 20 to 200, and number of floors, from 1 to 5. The weight on area has to be tiny to be useful and the weight on floors has to be large. Nothing is actually wrong with that, but the search in lesson 4 moves every parameter by the same-sized step, and a step that suits one of those is absurd for the other. The cheap fix is to squeeze each feature into the range 0 to 1: subtract the smallest value, divide by the range.<\/p>\n<p>A practitioner reaches for scikit-learn's <code>MinMaxScaler<\/code> here and it is two lines. Build it by hand once anyway, because of the part people get wrong. The smallest and largest you divide by are properties of the data you fitted on, and they have to be reused, unchanged, on every new row you ever predict for. Rescale tomorrow's reading using tomorrow's own minimum and maximum and you have quietly changed what the number means since training. This is exactly why lesson 6 of the Python track pushed one function called twice instead of two pasted copies.<\/p>"}, {"type": "code", "code": "# A category with more than two values does NOT become 1, 2, 3. Numbering it\n# invents an order -- \"Friday is three times Tuesday\" -- and the model believes\n# you. Give each value its own 0/1 column instead.\nsites = [\"north\", \"south\", \"north\", \"west\"]\nnames = sorted(set(sites))                 # ['north', 'south', 'west']\n\none_hot = []\nfor site in sites:\n    row = []\n    for name in names:\n        if site == name:\n            row.append(1)\n        else:\n            row.append(0)\n    one_hot.append(row)\n\nprint(one_hot)       # [[1, 0, 0], [0, 1, 0], [1, 0, 0], [0, 0, 1]]\n\n# Squeezing one column into 0..1, and keeping the two numbers that did it.\nareas = [20, 65, 200, 110]\nlow = min(areas)\nhigh = max(areas)\nscaled = [(a - low) / (high - low) for a in areas]\nprint(scaled)                              # [0.0, 0.25, 1.0, 0.5]\n\nprint((80 - low) / (high - low))           # 0.3333333333333333\n# Same low and high as before. Never recomputed on the new row.", "caption": "One-hot for categories, min-max for numbers. Both are arithmetic you can read."}, {"type": "callout", "kind": "warn", "title": "Leakage: the feature that already knows the answer", "body": "The fastest route to an unbelievable score is a feature that could only have been filled in after the thing you are predicting had already happened. Predicting whether a meter gets flagged for review, from a column called engineer_visited. Predicting a day's energy use, from the meter reading taken at the end of that day. The score is wonderful and the model is worthless, because on a real tomorrow that column is empty. Ask one question of every feature: would I actually have this number at the moment I need the prediction? If the answer is no, it is not a feature, whatever the spreadsheet calls it."}, {"type": "code", "code": "# One function, so the rows you fit on and tomorrow's row get identical treatment.\nWEEKEND = {\"Saturday\", \"Sunday\"}\n\ndef featurise(row, low, high):\n    if row[\"day\"] in WEEKEND:\n        is_weekend = 1\n    else:\n        is_weekend = 0\n    scaled_temp = (row[\"temp\"] - low) / (high - low)\n    return [scaled_temp, is_weekend]\n\ntemps = [2, 5, 8, 11, 14]\nlow = min(temps)\nhigh = max(temps)\n\nprint(featurise({\"day\": \"Tuesday\",  \"temp\": 8}, low, high))     # [0.5, 0]\nprint(featurise({\"day\": \"Saturday\", \"temp\": 8}, low, high))     # [0.5, 1]\n\n# Months later, same function, same low and high.\nprint(featurise({\"day\": \"Monday\", \"temp\": 20}, low, high))      # [1.5, 0]\n# 1.5 is outside the range this was fitted on, and the number says so out loud.\n# That is information about how far you are extrapolating, not a bug to clamp away.", "caption": "The featurise function is part of the model. Ship them together or do not ship."}], "exercise": {"brief": "Write a function named rescale that takes a list of numbers and returns a new list in which the smallest value becomes 0.0, the largest becomes 1.0, and everything else keeps its relative position in between. Order must be preserved, not sorted. Two edge cases: an empty list returns an empty list, and if every value is the same there is no range to divide by, so return 0.0 for every item instead of crashing.", "starter": "def rescale(xs):\n    low = min(xs)\n    high = max(xs)\n    return [(x - low) / (high - low) for x in xs]\n", "solution": "def rescale(xs):\n    if not xs:\n        return []\n    low = min(xs)\n    high = max(xs)\n    if high == low:\n        return [0.0 for x in xs]\n    return [(x - low) / (high - low) for x in xs]\n", "tests": [{"label": "smallest to 0, largest to 1, middle in between", "expr": "(lambda r: abs(r[0]) < 1e-9 and abs(r[1] - 0.5) < 1e-9 and abs(r[2] - 1.0) < 1e-9)(rescale([0, 5, 10]))"}, {"label": "empty list", "expr": "rescale([]) == []"}, {"label": "every value the same, no range to divide by", "expr": "(lambda r: len(r) == 3 and abs(r[0]) < 1e-9 and abs(r[1]) < 1e-9 and abs(r[2]) < 1e-9)(rescale([4, 4, 4]))"}, {"label": "a single value", "expr": "(lambda r: len(r) == 1 and abs(r[0]) < 1e-9)(rescale([7]))"}, {"label": "negatives are handled", "expr": "(lambda r: abs(r[0]) < 1e-9 and abs(r[1] - 0.5) < 1e-9 and abs(r[2] - 1.0) < 1e-9)(rescale([-10, 0, 10]))"}, {"label": "the order of the input is kept", "expr": "(lambda r: abs(r[0] - 1.0) < 1e-9 and abs(r[1]) < 1e-9)(rescale([9, 1]))"}]}}, {"id": "ml-03", "track": "ml", "order": 3, "title": "Loss: how a model knows it is wrong", "blurb": "Three candidate lines, all wrong, and no way to rank them. That missing number is called the loss.", "minutes": 13, "objectives": ["Compute mean squared error by hand over a handful of points", "Explain why errors are squared instead of added up as they come", "Read the loss as a score for a setting of the parameters, not for one prediction"], "sections": [{"type": "prose", "html": "<p>Three candidate lines from lesson 1, with <code>w<\/code> at -10, -14 and -18. Every one of them is wrong on every single day, by different amounts in different directions. Pick the best. You cannot, not in a way you could defend, because \"best\" has no definition yet.<\/p>\n<p>So define it. For one day the <strong>error<\/strong> is the obvious thing: prediction minus actual. Predicted 320, actual 350, error -30. Then you need one number for the whole dataset, and the first idea that comes to mind -- add the errors up -- is a trap worth seeing properly. A model that is 100 too high on Monday and 100 too low on Tuesday sums to zero, the same score as a model that got both days exactly right. Errors pointing in opposite directions must not be allowed to cancel.<\/p>\n<p>The fix is to make every error positive before adding. You could take the absolute value. The standard choice is to square it, which gives <strong>mean squared error<\/strong>: square each error, add them up, divide by how many there were. Squaring is not decoration. It means one humiliating miss costs more than several small ones that add to the same total -- out by 10 twice scores 100, out by 20 once scores 200 -- so the fit is pushed hard away from disasters. It also, as the next lesson needs, gives a loss whose steepness is easy to work out anywhere.<\/p>"}, {"type": "code", "code": "temps  = [2, 5, 8, 11, 14]\nactual = [395, 350, 300, 265, 220]\n\ndef report(w, b):\n    total_error = 0.0\n    total_squared = 0.0\n    for i in range(len(temps)):\n        error = (w * temps[i] + b) - actual[i]\n        total_error = total_error + error\n        total_squared = total_squared + error * error\n    mse = total_squared / len(temps)\n    print(f\"w={w:>6}, b={b:>5}   sum of errors {total_error:>6.1f}   mse {mse:>8.2f}\")\n\nreport(-14.5, 422)     # a line that fits well\nreport(0, 306)         # ignores the temperature, predicts the average every time\n\n# w= -14.5, b=  422   sum of errors    0.0   mse     9.50\n# w=     0, b=  306   sum of errors    0.0   mse  3794.00\n#\n# Identical sums. One model is useful and the other knows nothing about\n# temperature. That is why nobody adds raw errors.", "caption": "Both models score zero on the sum of errors. Squaring tells them apart by a factor of 400."}, {"type": "prose", "html": "<p>Now the reframing that makes the rest of this track work. Read it twice.<\/p>\n<p>Your data is fixed. You are not going to change the temperatures or the meter readings. The only things that can move are <code>w<\/code> and <code>b<\/code>. So the loss is not really a property of the predictions at all -- it is a <strong>function of the parameters<\/strong>. Hand it a <code>w<\/code> and a <code>b<\/code> and it hands back one number saying how badly that pair describes your data.<\/p>\n<p>Put that way, the goal stops being vague. There is a function, <code>loss(w, b)<\/code>, it has a lowest point somewhere, and fitting a model means finding the <code>w<\/code> and <code>b<\/code> that sit at that lowest point. That is the job. The next lesson is how you get there without trying every possibility.<\/p>\n<p>Two cautions while the idea is fresh. A low loss is a score for the fit, not a certificate of truth: a loss of zero on the data you fitted to normally means something has gone wrong rather than right, which is lesson 7. And mean squared error is a choice, not a law. It is the default for predicting numbers, it punishes outliers heavily, and if a few of your readings are broken rather than merely unusual, it will chase the broken ones hardest.<\/p>"}, {"type": "code", "code": "# The loss as a function of one parameter: hold b still, walk w across a range.\ndef mse(w, b):\n    total = 0.0\n    for i in range(len(temps)):\n        error = (w * temps[i] + b) - actual[i]\n        total = total + error * error\n    return total / len(temps)\n\nfor w in [-20, -18, -16, -14, -12, -10]:\n    print(f\"w = {w:>4}   loss = {mse(w, 422):>9.2f}\")\n\n# w =  -20   loss =   2490.00\n# w =  -18   loss =   1014.00\n# w =  -16   loss =    194.00\n# w =  -14   loss =     30.00     <- lowest of the six\n# w =  -12   loss =    522.00\n# w =  -10   loss =   1670.00\n#\n# Down, then up. The bottom of that valley is the answer, and it is somewhere\n# between -16 and -12 rather than at any value tried here.", "caption": "A valley with one bottom. Walking down it, without printing the whole table, is the next lesson."}, {"type": "callout", "kind": "tip", "title": "Divide by the count, and remember the units are squared", "body": "Always divide by the number of points. A total loss grows just because you added more data, so a total cannot be compared between yesterday and today, or between two datasets. Second, mean squared error comes out in the square of whatever you are predicting. A loss of 30 here means 30 kilowatt-hours squared, which no human can picture. Take the square root and you get root mean squared error, about 5.5 kilowatt-hours, which is a sentence you can say out loud to the person who sent the spreadsheet. Fit using mse, report rmse to people."}], "exercise": {"brief": "Write a function named mse that takes two lists of the same length -- the true values and the model's predictions -- and returns the mean squared error: the average of the squared difference for each pair. Predictions that are exactly right score 0.0, errors in opposite directions must not cancel, and two empty lists return 0.0 rather than dividing by zero.", "starter": "def mse(ys, preds):\n    total = 0.0\n    for i in range(len(ys)):\n        total = total + (ys[i] - preds[i])      # nothing stops these cancelling\n    return total / len(ys)\n", "solution": "def mse(ys, preds):\n    if not ys:\n        return 0.0\n    total = 0.0\n    for i in range(len(ys)):\n        error = ys[i] - preds[i]\n        total = total + error * error\n    return total / len(ys)\n", "tests": [{"label": "averages the squared errors", "expr": "abs(mse([1, 2, 3], [2, 2, 2]) - 2.0 / 3.0) < 1e-9"}, {"label": "perfect predictions score zero", "expr": "abs(mse([1.5, 2.5], [1.5, 2.5])) < 1e-9"}, {"label": "opposite errors do not cancel", "expr": "abs(mse([0, 0], [10, -10]) - 100.0) < 1e-9"}, {"label": "two empty lists", "expr": "abs(mse([], [])) < 1e-9"}, {"label": "a single pair", "expr": "abs(mse([3], [5]) - 4.0) < 1e-9"}, {"label": "one big miss costs more than two small ones", "expr": "mse([0, 0], [3, 0]) > mse([0, 0], [1.5, 1.5])"}]}}, {"id": "ml-04", "track": "ml", "order": 4, "title": "Gradient descent, and the step that overshoots", "blurb": "You have a score for every setting of w. Now find the lowest one without trying them all.", "minutes": 15, "objectives": ["Find which way is downhill by computing the loss twice", "Take repeated downhill steps and watch the loss fall", "Recognise a learning rate that is too large from the loss it produces"], "sections": [{"type": "prose", "html": "<p>Lesson 3 left you a function, <code>loss(w, b)<\/code>, and a goal: find the pair of numbers that makes it smallest. Brute force works, briefly. Try 100 values of <code>w<\/code> and keep the winner. Then you remember there is a <code>b<\/code> too, so it is 100 by 100, which is 10,000. A model with ten features has ten weights, and 100 to the power of 10 is more combinations than there are seconds in a lifetime. Trying everything is not a method; it is proof that you need one.<\/p>\n<p><strong>Gradient descent<\/strong> gives up on seeing the landscape at all. You stand at one setting of <code>w<\/code> and ask a single local question: if I nudge <code>w<\/code> up a little, does the loss get better or worse? You can already answer that with arithmetic you have -- compute the loss twice.<\/p>\n<p>At <code>w = -10<\/code> the loss is 1670. Nudge to -9.999 and it comes out slightly higher, so up is uphill and downhill is the other way. Make it a rate rather than a yes or no: take the change in loss, divide by the size of the nudge, and you have loss units per unit of <code>w<\/code>. That number is the <strong>gradient<\/strong>, and only two things about it matter. Its sign says which way is uphill. Its size says how steep the ground is, which is big far from the bottom and close to zero at the bottom itself.<\/p>\n<p>Then the step, which is the entire algorithm: <code>w = w - rate * slope<\/code>. Subtract, because you want to move against the slope. If the slope is positive, the loss rises to the right, so you go left. Where the ground is steep you move a long way; as it flattens out you automatically slow down and settle.<\/p>"}, {"type": "code", "code": "temps  = [2, 5, 8, 11, 14]\nactual = [395, 350, 300, 265, 220]\nb = 422\n\ndef loss(w):\n    total = 0.0\n    for i in range(len(temps)):\n        error = (w * temps[i] + b) - actual[i]\n        total = total + error * error\n    return total / len(temps)\n\ndef slope_at(w):\n    h = 0.001                       # the nudge: small, but not so small it is noise\n    return (loss(w + h) - loss(w)) / h\n\nfor w in [-20, -16, -14.5, -12, -10]:\n    print(f\"w = {w:>6}   loss = {loss(w):>9.2f}   slope = {slope_at(w):>9.2f}\")\n\n# w =    -20   loss =   2490.00   slope =   -901.92\n# w =    -16   loss =    194.00   slope =   -245.92\n# w =  -14.5   loss =      9.50   slope =      0.08\n# w =    -12   loss =    522.00   slope =    410.08\n# w =    -10   loss =   1670.00   slope =    738.08\n#\n# Negative to the left of the bottom, positive to the right, and essentially\n# zero at the bottom. The slope at -14.5 is 0.08 rather than 0.00 only because\n# the nudge has a width; shrink h and it shrinks too.", "caption": "Two loss values and a division. No calculus needed to find out which way is down."}, {"type": "prose", "html": "<p>The step rule has one knob in it, the <strong>learning rate<\/strong>, and that knob decides whether any of this works.<\/p>\n<p>Too small and nothing is wrong except your afternoon: each step moves a hair, the loss creeps down, and you need 50,000 steps for something that deserved 50. Too large is a different animal entirely. You step straight over the bottom of the valley and land further up the far side, where the ground is steeper, so the next step is bigger, so you land further up still. Three rounds of that and the numbers are in the millions; a few more and Python prints <code>inf<\/code> or <code>nan<\/code>, and every prediction afterwards is garbage. The model did not fail to learn. It was thrown out of the valley.<\/p>\n<p>Diagnosis is free, so always do it: print the loss every few steps. Falling steadily, carry on. Falling and then bouncing around a floor it never breaks through, the rate is slightly too big for the last stretch, so cut it. Rising, or <code>inf<\/code>, or <code>nan<\/code>, the rate is far too big -- divide it by ten and start over before you touch anything else. Note also that the right rate depends on the size of your features, which is the other reason lesson 2 insisted on scaling: with one feature in the hundreds and another in single digits, no single rate suits both parameters.<\/p>\n<p>In a real job you would not write this loop. The gradient would come from a library that works it out exactly rather than by nudging, and the step from an optimiser like the one inside scikit-learn's <code>SGDRegressor<\/code>. Writing it by hand once is what turns \"the loss went to nan\" from a mystery into a sentence with an obvious cause.<\/p>"}, {"type": "code", "code": "def descend(start_w, rate, steps):\n    w = start_w\n    for step in range(steps):\n        w = w - rate * slope_at(w)\n        print(f\"   step {step}: w = {w:>12.4f}   loss = {loss(w):>14.2f}\")\n    return w\n\ndescend(-10.0, 0.0002, 6)      # too small: correct direction, no hurry\n#   step 0: w =     -10.1476   loss =        1562.85\n#   step 5: w =     -10.8162   loss =        1122.29      still miles away\n\ndescend(-10.0, 0.005, 6)       # about right\n#   step 0: w =     -13.6904   loss =          63.25\n#   step 1: w =     -14.3547   loss =          11.23\n#   step 3: w =     -14.4958   loss =           9.50\n#   step 5: w =     -14.5003   loss =           9.50      settled\n\ndescend(-10.0, 0.02, 6)        # too large: thrown out of the valley\n#   step 0: w =     -24.7616   loss =        8644.20\n#   step 1: w =       8.8949   loss =       44889.85      wrong side, and further\n#   step 2: w =     -67.8420   loss =      233329.84\n#   step 3: w =     107.1181   loss =     1212869.27\n#   step 5: w =     617.7219   loss =    32775776.34      multiplying by 5 a step", "caption": "Same loss, same starting point, three rates. Only the third one is interesting, and only as a warning."}, {"type": "callout", "kind": "warn", "title": "A loss that climbs is a rate problem, not a data problem", "body": "When training blows up -- loss rising step after step, numbers turning into inf or nan -- the first suspect is the learning rate, not your data and not your model. Divide the rate by ten and run it again before you change anything else. The second suspect is features on wildly different scales, which makes a single rate that suits every parameter impossible to pick. Checking both of those costs two minutes. Rewriting a model that was never broken costs the rest of the day."}, {"type": "code", "code": "# Both parameters at once. Same idea, one slope per parameter, both updated\n# from the same starting point before either is used again.\ndef loss2(w, b):\n    total = 0.0\n    for i in range(len(temps)):\n        error = (w * temps[i] + b) - actual[i]\n        total = total + error * error\n    return total / len(temps)\n\nw = 0.0\nb = 0.0\nh = 0.001\nrate = 0.005\n\nfor step in range(2001):\n    slope_w = (loss2(w + h, b) - loss2(w, b)) / h\n    slope_b = (loss2(w, b + h) - loss2(w, b)) / h\n    w = w - rate * slope_w\n    b = b - rate * slope_b\n    if step % 500 == 0:\n        print(f\"step {step:>4}: w = {w:>8.3f}  b = {b:>8.3f}  loss = {loss2(w, b):>10.2f}\")\n\n# step    0: w =   21.870  b =    3.060  loss =   40198.67\n# step  500: w =   -0.715  b =  281.077  loss =    4368.99\n# step 1000: w =   -9.859  b =  374.552  loss =     503.69\n# step 1500: w =  -12.938  b =  406.032  loss =      65.47\n# step 2000: w =  -13.976  b =  416.633  loss =      15.82\n#\n# Heading for -14.5 and 422, and taking thousands of steps to get there. The\n# temperature runs from 2 to 14 while b has to travel to 422, so one shared\n# rate cannot suit both. Scale the features and this converges in dozens.", "caption": "Two parameters, two slopes, same step rule. Slow here for a reason you can now name."}], "exercise": {"brief": "The loss you are minimising is loss(w) = (w - 3) squared, and its slope at any w is 2 * (w - 3). Take that slope formula as given. Write a function named descend that takes a starting w, a learning rate and a number of steps, and returns w after that many downhill steps, where each step replaces w with w minus the rate times the slope at w. With 0 steps it returns the starting w unchanged. Do not guard or clamp the result: if the rate is too large, the runaway value it actually reaches is the correct answer.", "starter": "def descend(start, rate, steps):\n    w = start\n    for i in range(steps):\n        slope = 2 * (w - 3)\n        w = w + rate * slope       # check this sign against the valley\n    return w\n", "solution": "def descend(start, rate, steps):\n    w = start\n    for i in range(steps):\n        slope = 2 * (w - 3)\n        w = w - rate * slope\n    return w\n", "tests": [{"label": "walks downhill towards 3", "expr": "abs(descend(0.0, 0.1, 100) - 3.0) < 1e-6"}, {"label": "arrives from above as well", "expr": "abs(descend(10.0, 0.1, 100) - 3.0) < 1e-6"}, {"label": "zero steps changes nothing", "expr": "abs(descend(7.5, 0.1, 0) - 7.5) < 1e-9"}, {"label": "already at the bottom, slope is zero, stays put", "expr": "abs(descend(3.0, 0.5, 50) - 3.0) < 1e-9"}, {"label": "a rate of zero never moves", "expr": "abs(descend(8.0, 0.0, 100) - 8.0) < 1e-9"}, {"label": "a rate that is far too large runs away", "expr": "abs(descend(2.0, 1.5, 30)) > 1000"}]}}, {"id": "ml-05", "track": "ml", "order": 5, "title": "Linear regression from scratch", "blurb": "Eight days of readings, one straight line, no libraries. Twenty lines of arithmetic from data to answer.", "minutes": 15, "objectives": ["Fit a straight line to data with the move-together over spread formula", "Run the whole job end to end: fit, predict, score, check the residuals", "State what a fitted slope means in the units of the problem, and where it stops being true"], "sections": [{"type": "prose", "html": "<p>Everything so far has been a piece: a function with parameters, features, a loss, a way downhill. Here they go together on eight days of real-looking data, and the whole thing fits on one screen.<\/p>\n<p>There are two routes to the same answer. Keep stepping downhill as in lesson 4, which works for any model and is how anything complicated is actually trained. Or, because this particular model is a straight line, use the formula that lands on the bottom of the valley in one shot. The formula is worth knowing, and it is school arithmetic rather than anything exotic.<\/p>\n<p>It is a ratio: how much <code>x<\/code> and <code>y<\/code> move together, divided by how much <code>x<\/code> moves on its own. For every point, measure how far its <code>x<\/code> is from the average <code>x<\/code>, and how far its <code>y<\/code> is from the average <code>y<\/code>, then multiply those two distances. An above-average <code>x<\/code> paired with an above-average <code>y<\/code> gives a positive product; above-average <code>x<\/code> with below-average <code>y<\/code> gives a negative one. Add those products up and you have a number whose sign is the direction of the relationship and whose size is its strength. Divide by the sum of the squared <code>x<\/code> distances and the result is in the right units: <code>y<\/code> per unit of <code>x<\/code>. That is <code>w<\/code>. Then <code>b<\/code> is whatever makes the line pass through the middle of the cloud: the average <code>y<\/code> minus <code>w<\/code> times the average <code>x<\/code>.<\/p>\n<p>In a job this is <code>LinearRegression().fit(X, y)<\/code> from scikit-learn and you move on with your day. Write the twenty lines once, because the formula tells you something the method call hides: it has a division in it, and you can see exactly when the bottom falls out of it.<\/p>"}, {"type": "code", "code": "temps  = [2, 4, 5, 7, 8, 11, 13, 14]\nactual = [395, 360, 352, 318, 300, 266, 230, 220]\n\ndef fit_line(xs, ys):\n    n = len(xs)\n    if n == 0:\n        return (0.0, 0.0)\n    mean_x = sum(xs) / n\n    mean_y = sum(ys) / n\n\n    together = 0.0            # how x and y move together\n    spread = 0.0              # how much x moves on its own\n    for i in range(n):\n        together = together + (xs[i] - mean_x) * (ys[i] - mean_y)\n        spread = spread + (xs[i] - mean_x) ** 2\n\n    if spread == 0.0:\n        # Every x identical: no evidence about what happens when x changes,\n        # so there is no slope to report. Predict the average and say so.\n        return (0.0, mean_y)\n\n    w = together / spread\n    return (w, mean_y - w * mean_x)\n\nw, b = fit_line(temps, actual)\nprint(f\"w = {w:.4f}   b = {b:.4f}\")        # w = -14.5152   b = 421.2462\n\ndef mse(w, b):\n    total = 0.0\n    for i in range(len(temps)):\n        error = (w * temps[i] + b) - actual[i]\n        total = total + error * error\n    return total / len(temps)\n\nprint(f\"fitted:   mse {mse(w, b):>8.2f}   rmse {mse(w, b) ** 0.5:>6.2f}\")\nprint(f\"baseline: mse {mse(0, 305.125):>8.2f}   rmse {mse(0, 305.125) ** 0.5:>6.2f}\")\n# fitted:   mse    10.98   rmse   3.31\n# baseline: mse  3487.36   rmse  59.05", "caption": "The whole fit, with the zero-spread case handled on purpose rather than by accident."}, {"type": "prose", "html": "<p>Now read the answer, because a number with no units attached is a number nobody can argue with, which is the opposite of useful.<\/p>\n<p><code>w<\/code> is -14.5152, and its units are kilowatt-hours per degree: one degree warmer outside, about 14.5 fewer kilowatt-hours used. That is a sentence you can take to the person who owns the building, and they can tell you whether it sounds right. <code>b<\/code> is 421.2, the prediction at 0 degrees -- which is outside the range you fitted on, since your coldest day was 2 degrees, so treat it as the place the line happens to cross rather than a fact about freezing weather.<\/p>\n<p>Scoring it: rmse 3.31 kilowatt-hours against a baseline of 59.05 for always predicting the average. The line is doing real work. Always compute that baseline. A model that cannot beat the average is not a model, and \"the error is only 3.31\" means nothing until you know what you are comparing it against.<\/p>\n<p>Finally, look at the residuals -- prediction minus actual, one per day. You are not hoping for zeros. You are hoping for a mess: small, mixed signs, no pattern. If instead the residuals are negative at one end and positive at the other, the relationship is not a straight line, and no amount of fitting a straight line will fix the shape of a straight line.<\/p>"}, {"type": "callout", "kind": "warn", "title": "A fitted line keeps going where your data stopped", "body": "This line was fitted between 2 and 14 degrees. Ask it about 30 degrees and it answers -14.2 kilowatt-hours, which is a building that generates electricity by being warm. The arithmetic is not broken; you asked a question the data never addressed and got a confident answer anyway, which is the single easiest way to embarrass yourself with a model. Write down the range of every feature you fitted on, and when a prediction comes from outside it, say so next to the number. The same applies to time: a line fitted on last winter is a claim about last winter."}, {"type": "code", "code": "print(f\"{'temp':>5} {'predicted':>10} {'actual':>8} {'residual':>9}\")\nfor i in range(len(temps)):\n    predicted = w * temps[i] + b\n    print(f\"{temps[i]:>5} {predicted:>10.1f} {actual[i]:>8} {predicted - actual[i]:>9.1f}\")\n\n#  temp  predicted   actual  residual\n#     2      392.2      395      -2.8\n#     4      363.2      360       3.2\n#     5      348.7      352      -3.3\n#     7      319.6      318       1.6\n#     8      305.1      300       5.1\n#    11      261.6      266      -4.4\n#    13      232.5      230       2.5\n#    14      218.0      220      -2.0\n#\n# Signs flipping about at random, nothing bigger than about 5. That is what a\n# straight line fitting a straight relationship looks like. A column of\n# residuals that goes minus, minus, plus, plus, plus, minus, minus is a curve\n# wearing a line as a disguise.", "caption": "Check the residuals every time. It costs four lines and catches the mistake a loss number hides."}], "exercise": {"brief": "Write a function named fit_line that takes a list of inputs and a list of true values of the same length and returns the pair (w, b) for the best-fitting straight line, using the formula from this lesson. Handle two edge cases without crashing: empty lists return (0.0, 0.0), and if every input is the same value there is no slope to find, so return 0.0 for w and the mean of the true values for b.", "starter": "def fit_line(xs, ys):\n    # slope as the ratio of the two averages -- plausible, and wrong\n    w = (sum(ys) / len(ys)) / (sum(xs) / len(xs))\n    b = 0.0\n    return (w, b)\n", "solution": "def fit_line(xs, ys):\n    n = len(xs)\n    if n == 0:\n        return (0.0, 0.0)\n    mean_x = sum(xs) / n\n    mean_y = sum(ys) / n\n    together = 0.0\n    spread = 0.0\n    for i in range(n):\n        together = together + (xs[i] - mean_x) * (ys[i] - mean_y)\n        spread = spread + (xs[i] - mean_x) ** 2\n    if spread == 0.0:\n        return (0.0, mean_y)\n    w = together / spread\n    return (w, mean_y - w * mean_x)\n", "tests": [{"label": "finds a line that fits exactly", "expr": "(lambda r: abs(r[0] - 2.0) < 1e-9 and abs(r[1] - 1.0) < 1e-9)(fit_line([0, 1, 2, 3], [1, 3, 5, 7]))"}, {"label": "best compromise when no line fits perfectly", "expr": "(lambda r: abs(r[0] - 1.5) < 1e-9 and abs(r[1] + 0.5) < 1e-9)(fit_line([0, 1, 2], [0, 0, 3]))"}, {"label": "a negative slope", "expr": "(lambda r: abs(r[0] + 2.0) < 1e-9 and abs(r[1] - 10.0) < 1e-9)(fit_line([0, 1, 2], [10, 8, 6]))"}, {"label": "empty lists", "expr": "(lambda r: len(r) == 2 and abs(r[0]) < 1e-9 and abs(r[1]) < 1e-9)(fit_line([], []))"}, {"label": "every input the same, so no slope exists", "expr": "(lambda r: abs(r[0]) < 1e-9 and abs(r[1] - 2.0) < 1e-9)(fit_line([2, 2, 2], [1, 2, 3]))"}, {"label": "a single point has no slope either", "expr": "(lambda r: abs(r[0]) < 1e-9 and abs(r[1] - 7.0) < 1e-9)(fit_line([5], [7]))"}]}}, {"id": "ml-06", "track": "ml", "order": 6, "title": "Classification and the decision boundary", "blurb": "The answer is not a number any more. It is 'send an engineer' or 'leave it', and that changes what the output means.", "minutes": 14, "objectives": ["Turn a score into a class with a threshold", "Describe the decision boundary as the place where the score is exactly zero", "Say why moving the threshold trades one kind of mistake for the other"], "sections": [{"type": "prose", "html": "<p>Same building, different question. Instead of how many kilowatt-hours tomorrow, the facilities team want to know which meters need an engineer. The answer is not a number on a scale; it is one of two labels, faulty or fine. Call them 1 and 0.<\/p>\n<p>You could try to build a function that outputs 1 or 0 directly, but a straight line outputs 3.7 and -0.2 and 418. The standard move keeps the line exactly as it is and bolts one step onto the end. The line computes a <strong>score<\/strong>, and a threshold turns the score into a class: at or above zero, call it 1; below zero, call it 0.<\/p>\n<p>With a single feature -- say the number of zero readings a meter reported today -- the interesting place is the one input where the score comes out exactly zero. Either side of it the answer flips. Solve <code>w * x + b = 0<\/code> and you get <code>x = -b / w<\/code>: one point on the number line. With <code>w<\/code> at 1.0 and <code>b<\/code> at -2.5, that point is 2.5, and the model reduces to \"flag it if it had three or more zero readings\". The two parameters you fitted are a threshold in disguise.<\/p>"}, {"type": "code", "code": "def score(zeros, w, b):\n    return w * zeros + b\n\nw = 1.0\nb = -2.5\n\nfor zeros in [0, 1, 2, 3, 5]:\n    s = score(zeros, w, b)\n    if s >= 0:\n        label = 1\n    else:\n        label = 0\n    print(f\"{zeros} zero readings -> score {s:>5.1f} -> class {label}\")\n\n# 0 zero readings -> score  -2.5 -> class 0\n# 1 zero readings -> score  -1.5 -> class 0\n# 2 zero readings -> score  -0.5 -> class 0\n# 3 zero readings -> score   0.5 -> class 1\n# 5 zero readings -> score   2.5 -> class 1\n\nprint(\"boundary at\", -b / w)        # boundary at 2.5", "caption": "One feature, so the boundary is a single point. The score only matters through its sign."}, {"type": "prose", "html": "<p>Add a second feature and the picture gets more interesting without getting harder. Say the second feature is how far the meter's daily total sits from its usual total, in kilowatt-hours. The score becomes <code>w1 * x1 + w2 * x2 + b<\/code>, and the set of points where that comes out exactly zero is no longer one point: it is a straight line drawn across the plane of the two features. Everything on one side is class 1, everything on the other is class 0. That line is the <strong>decision boundary<\/strong>, and it is the entire model. The weights decide which way it tilts; the bias decides how far from the origin it sits.<\/p>\n<p>Rearranging makes it concrete. With <code>w1<\/code> at 1.0 per zero reading, <code>w2<\/code> at 0.05 per kilowatt-hour and <code>b<\/code> at -2.5, the boundary is: deviation = 50 minus 20 times the zero readings. With no zero readings you need 50 kilowatt-hours of deviation before anything gets flagged; with two zero readings, 10 will do. The two features trade against each other at a rate the weights set, which is also why a weight is readable: 1.0 against 0.05 says one zero reading carries as much weight as 20 kilowatt-hours of deviation.<\/p>\n<p>The size of the score is worth something too, even though the class only depends on its sign. A point far from the boundary is a prediction the model is confident about; a point just the wrong side of zero is a coin flip reported as a decision. Real classifiers squeeze the score into the range 0 to 1 with a logistic function so it can be read as a probability -- that is what <code>LogisticRegression<\/code> in scikit-learn is doing, and what it adds is the squeezing and a loss suited to it, not a different idea about boundaries.<\/p>\n<p>And the threshold is a choice, not a fact. Nothing forces it to be zero. Move it down and you flag more meters: you catch more real faults and send more engineers out for nothing. Move it up and the opposite. Which way you want that dial turned is a question about vans and money, not about the data, and lesson 8 is how to measure both halves of it. One last thing: some classes cannot be separated by a straight line at all -- faulty meters clustered both far above and far below normal, with fine ones in between. Then you either change the shape of the model or add a feature that makes it linear again, such as the distance from normal rather than the signed difference. That is lesson 2 arriving again, in a new suit.<\/p>"}, {"type": "code", "code": "def classify(points, w1, w2, b):\n    out = []\n    for p in points:\n        s = w1 * p[0] + w2 * p[1] + b\n        if s >= 0:                 # the tie goes to class 1, and that is a decision\n            out.append(1)\n        else:\n            out.append(0)\n    return out\n\n# each point is [zero readings, deviation from usual total in kWh]\npoints = [[0, 80], [0, 40], [2, 10], [2, 9], [4, -60], [5, 0]]\nprint(classify(points, 1.0, 0.05, -2.5))      # [1, 0, 1, 0, 0, 1]\n\n# scores:            1.50  -0.50   0.00  -0.05  -1.50   2.50\n#                                   ^ exactly on the boundary, so class 1\n#\n# The boundary as a line you can draw: deviation = 50 - 20 * zero_readings\nfor zeros in [0, 1, 2, 3]:\n    print(f\"with {zeros} zero readings, flagged above {(2.5 - zeros) / 0.05:>6.1f} kWh\")\n# with 0 zero readings, flagged above   50.0 kWh\n# with 1 zero readings, flagged above   30.0 kWh\n# with 2 zero readings, flagged above   10.0 kWh\n# with 3 zero readings, flagged above  -10.0 kWh   (flagged whatever the deviation)", "caption": "Two features, one line, and a point sitting exactly on it."}, {"type": "callout", "kind": "warn", "title": "Decide what happens on the boundary, in writing", "body": "A score of exactly zero is not a freak event. Whole-number features, a row of defaults, a brand new meter with nothing recorded yet: all of them land on zero far more often than the arithmetic suggests. If the tie is not handled deliberately, two implementations of the same model disagree on those rows, and the one with the strict comparison quietly answers 0 to everything it has never seen. Pick a side, write it in the comparison, and say which side you picked when you hand the model over. Here, at or above zero means class 1."}], "exercise": {"brief": "Write a function named classify that takes a list of points -- each point a list of two feature numbers -- plus the parameters w1, w2 and b. For each point compute the score w1 times the first feature, plus w2 times the second feature, plus b, and return a list holding 1 where the score is zero or above and 0 where it is below. An empty list of points returns an empty list, and a point whose score is exactly zero counts as class 1.", "starter": "def classify(points, w1, w2, b):\n    out = []\n    for p in points:\n        if w1 * p[0] + b > 0:      # two things wrong in one line\n            out.append(1)\n        else:\n            out.append(0)\n    return out\n", "solution": "def classify(points, w1, w2, b):\n    out = []\n    for p in points:\n        s = w1 * p[0] + w2 * p[1] + b\n        if s >= 0:\n            out.append(1)\n        else:\n            out.append(0)\n    return out\n", "tests": [{"label": "splits points either side of the boundary", "expr": "classify([[2, 2], [-2, -2]], 1, 1, 0) == [1, 0]"}, {"label": "a score of exactly zero is class 1", "expr": "classify([[0, 0]], 1, 1, 0) == [1]"}, {"label": "no points, no classes", "expr": "classify([], 1, 1, 0) == []"}, {"label": "the second feature counts too", "expr": "classify([[0, 5], [0, -5]], 0, 1, 0) == [1, 0]"}, {"label": "a big bias puts everything in one class", "expr": "classify([[1, 1], [-1, -1], [0, 3]], 1, 1, 100) == [1, 1, 1]"}, {"label": "negative weights flip which side is which", "expr": "classify([[2, 0], [-2, 0]], -1, 0, 0) == [0, 1]"}]}}, {"id": "ml-07", "track": "ml", "order": 7, "title": "Overfitting, and why your 100 per cent is a lie", "blurb": "The model gets every row right. You have measured its memory, not its judgement.", "minutes": 15, "objectives": ["Explain the difference between memorising the data and learning the pattern", "Split data into a training set and a test set and score on both", "Read the gap between the two scores, and say which model you would ship"], "sections": [{"type": "prose", "html": "<p>Here is a model that scores 100 per cent on any dataset you give it. To predict the label of an input, look through the data for the input closest to it and copy that one's label. Run it on the data it was built from and every point's closest neighbour is itself, so it is right every time, by construction. It has learned nothing. It has a filing cabinet.<\/p>\n<p>That is the trap in its purest form, and the lesson generalises: <strong>a score measured on the data you fitted to is not evidence.<\/strong> It tells you the model can reproduce what it has already seen. Nobody is paying for that. What anyone actually wants to know is how the model does on a day it has never seen, and you cannot test that on data it has seen.<\/p>\n<p>Since tomorrow's data is not available today, you fake it. Hide some of the rows before you fit anything. Fit on the rest. Then score on the hidden rows, which the fitting never touched -- they are your stand-in for the future. The part you fit on is the <strong>training set<\/strong>; the part you held back is the <strong>test set<\/strong>. In a real job this is <code>train_test_split<\/code> from scikit-learn, one line; slice the list yourself once and it becomes obvious how easy it is to let the test set leak in.<\/p>"}, {"type": "code", "code": "# feature: how far a meter's daily total sat from its usual total, in kWh\n# label:   1 if an engineer found a real fault, 0 if not\nxs = [2, 5, 9, 12, 16, 21, 25, 30]\nys = [0, 0, 1,  0,  1,  1,  0,  1]\n\nn_train = 4\ntrain_xs, train_ys = xs[:n_train], ys[:n_train]\ntest_xs,  test_ys  = xs[n_train:], ys[n_train:]\n\ndef memoriser(q):                      # copy the nearest training point's label\n    best = 0\n    for j in range(len(train_xs)):\n        if abs(train_xs[j] - q) < abs(train_xs[best] - q):\n            best = j\n    return train_ys[best]\n\ndef threshold(q):                      # one number, one rule\n    if q > 14:\n        return 1\n    return 0\n\ndef accuracy(model, part_xs, part_ys):\n    right = 0\n    for i in range(len(part_xs)):\n        if model(part_xs[i]) == part_ys[i]:\n            right = right + 1\n    return right / len(part_xs)\n\nfor name, model in [(\"memoriser\", memoriser), (\"threshold\", threshold)]:\n    tr = accuracy(model, train_xs, train_ys)\n    te = accuracy(model, test_xs, test_ys)\n    print(f\"{name}:  train {tr:.2f}   test {te:.2f}\")\n\n# memoriser:  train 1.00   test 0.25\n# threshold:  train 0.75   test 0.75", "caption": "Two models. The one with the perfect training score is the one you must not ship."}, {"type": "prose", "html": "<p>Those four numbers are the lesson. The memoriser is perfect on the training set and worse than a coin on the test set. The dull threshold is wrong on a quarter of the training set and stays wrong on about a quarter of the test set. If you had only looked at training scores you would have shipped the memoriser, and it would have been wrong three times out of four in the field.<\/p>\n<p><strong>Overfitting<\/strong> is that gap. The model had enough freedom to bend itself around every individual point, including the random noise in them, and noise does not repeat. <strong>Underfitting<\/strong> is the other failure: the shape is too simple to capture what is there, and you can spot it because the training score is poor too. Both scores bad, underfitting. Training good and test bad, overfitting. Training good and test good, go home.<\/p>\n<p>Which means the gap between the two numbers is the diagnostic, and chasing a training score is actively harmful. More parameters and fancier shapes always make the training score better. They stop making the test score better long before that, and then start making it worse.<\/p>\n<p>Three rules that are not optional. Split before you look -- any decision you make after seeing the test set has used it. Split at random, unless the data is in time order, in which case split by time, because training on later rows to predict earlier ones is cheating with extra steps. And never tune against the test set: if you try thirty ideas and keep whichever scored best on the test set, that score is now optimistic too, because you chose it for scoring well. Practitioners hold back a third slice, untouched until the very end, for exactly this reason.<\/p>"}, {"type": "code", "code": "import random\n\nrows_x = [2, 5, 9, 12, 16, 21, 25, 30]\nrows_y = [0, 0, 1,  0,  1,  1,  0,  1]\n\n# Shuffle positions, not the two lists separately -- they must stay paired.\norder = list(range(len(rows_x)))\nrandom.seed(0)                         # a fixed seed, so today's split is repeatable\nrandom.shuffle(order)\n\ncut = int(len(order) * 0.75)           # 75 per cent to train on, 25 to test on\ntrain_idx = order[:cut]\ntest_idx = order[cut:]\n\ntrain_x = [rows_x[i] for i in train_idx]\ntrain_y = [rows_y[i] for i in train_idx]\ntest_x = [rows_x[i] for i in test_idx]\ntest_y = [rows_y[i] for i in test_idx]\n\nprint(train_x, train_y)        # [16, 5, 21, 9, 2, 12] [1, 0, 1, 1, 0, 0]\nprint(test_x, test_y)          # [30, 25] [1, 0]\n\n# Scaling from lesson 2 goes HERE, after the split, using the training rows only.\n# Compute the minimum and maximum on the whole dataset and the test set has\n# already told you something about itself. That is leakage, and it is quiet.", "caption": "Shuffle the positions so features and labels stay together. Seed it, or you cannot reproduce your own result."}, {"type": "callout", "kind": "warn", "title": "Tuning against the test set fools you twice", "body": "The test set is a one-shot measurement. Every time you look at a test score and change something because of it -- a parameter, a feature, which model to use -- you spend a little of its honesty, and after thirty rounds the number it reports is the score of the luckiest choice rather than the quality of the model. The fix is to split three ways: train to fit on, a validation slice to make choices with, and a test slice you open once, at the end, and report whatever it says. If that number disappoints you, the honest move is to report it, not to go back for a thirty-first attempt."}], "exercise": {"brief": "Write a function named train_test_accuracy that takes a list of single-number inputs, a list of their 0-or-1 labels, and how many of the leading rows form the training set, with the rest forming the test set. The model is the memoriser from this lesson: to predict for an input, find the training input with the smallest absolute difference from it -- earliest one wins a tie -- and copy that training row's label. Return the pair (training accuracy, test accuracy), each the fraction of that part predicted correctly. An empty part scores 0.0, and if the training set is empty both scores are 0.0 because there is nothing to copy from.", "starter": "def train_test_accuracy(xs, ys, n_train):\n    right = 0\n    for i in range(len(xs)):\n        best = 0\n        for j in range(len(xs)):\n            if abs(xs[j] - xs[i]) < abs(xs[best] - xs[i]):\n                best = j\n        if ys[best] == ys[i]:\n            right = right + 1\n    acc = right / len(xs)\n    return (acc, acc)       # scored on everything, so both numbers say the same thing\n", "solution": "def train_test_accuracy(xs, ys, n_train):\n    train_xs = xs[:n_train]\n    train_ys = ys[:n_train]\n    if not train_xs:\n        return (0.0, 0.0)\n\n    scores = []\n    parts = [(train_xs, train_ys), (xs[n_train:], ys[n_train:])]\n    for part_xs, part_ys in parts:\n        if not part_xs:\n            scores.append(0.0)\n        else:\n            right = 0\n            for i in range(len(part_xs)):\n                best = 0\n                for j in range(len(train_xs)):\n                    if abs(train_xs[j] - part_xs[i]) < abs(train_xs[best] - part_xs[i]):\n                        best = j\n                if train_ys[best] == part_ys[i]:\n                    right = right + 1\n            scores.append(right / len(part_xs))\n    return (scores[0], scores[1])\n", "tests": [{"label": "training score beats test score on data it has not seen", "expr": "(lambda r: r[0] > r[1])(train_test_accuracy([0, 1, 2, 3], [0, 0, 1, 1], 2))"}, {"label": "that gap is 1.00 against 0.00", "expr": "(lambda r: abs(r[0] - 1.0) < 1e-9 and abs(r[1]) < 1e-9)(train_test_accuracy([0, 1, 2, 3], [0, 0, 1, 1], 2))"}, {"label": "nothing held back, so no test score to report", "expr": "(lambda r: abs(r[0] - 1.0) < 1e-9 and abs(r[1]) < 1e-9)(train_test_accuracy([0, 1, 2, 3], [0, 0, 1, 1], 4))"}, {"label": "two identical inputs with different labels dent even the training score", "expr": "(lambda r: abs(r[0] - 0.5) < 1e-9)(train_test_accuracy([1, 1], [0, 1], 2))"}, {"label": "no training rows at all", "expr": "(lambda r: abs(r[0]) < 1e-9 and abs(r[1]) < 1e-9)(train_test_accuracy([1, 2], [0, 1], 0))"}, {"label": "a test row next to a neighbour that agrees with it is counted right", "expr": "(lambda r: abs(r[1] - 1.0) < 1e-9)(train_test_accuracy([0, 10, 0.1], [0, 1, 0], 2))"}]}}, {"id": "ml-08", "track": "ml", "order": 8, "title": "Evaluating honestly", "blurb": "Ten meters in a thousand are faulty. A model that says 'all fine' every time is 99 per cent accurate and worth nothing.", "minutes": 14, "objectives": ["Say when accuracy is misleading, and name the thing that gives it away", "Compute precision and recall from the four counts, by hand", "Choose which of the two matters more for a given problem and defend the choice"], "sections": [{"type": "prose", "html": "<p>A thousand meters, ten of them faulty. Your model: <code>return 0<\/code>. It never flags anything. Accuracy 99 per cent. Put that in the report and it is not even a lie.<\/p>\n<p>Accuracy is the fraction of rows you got right, and when one class is rare it is measuring the wrong thing. You can get nearly everything right by ignoring the rare class completely, and the rare class was the only part anyone cared about -- nobody built this to find the 990 meters that are fine. So the first thing to compute on any classification problem is not accuracy. It is how many of each class you have. If the answer is 990 to 10, accuracy is a thermometer in a different room.<\/p>\n<p>What you need instead is four counts, and once you have them everything else is arithmetic. Pick the class you care about and call it positive -- here, faulty. Then: a <strong>true positive<\/strong> is flagged and faulty. A <strong>false positive<\/strong> is flagged and fine, so an engineer drives out for nothing. A <strong>false negative<\/strong> is not flagged and faulty, so the fault sits there. A <strong>true negative<\/strong> is not flagged and fine. Every classification result that has ever existed is those four numbers.<\/p>"}, {"type": "code", "code": "def counts(preds, labels):\n    tp = fp = fn = tn = 0\n    for i in range(len(preds)):\n        if preds[i] == 1 and labels[i] == 1:\n            tp = tp + 1\n        elif preds[i] == 1 and labels[i] == 0:\n            fp = fp + 1\n        elif preds[i] == 0 and labels[i] == 1:\n            fn = fn + 1\n        else:\n            tn = tn + 1\n    return (tp, fp, fn, tn)\n\ndef report(name, tp, fp, fn, tn):\n    accuracy = (tp + tn) / (tp + fp + fn + tn)\n    if tp + fp == 0:\n        precision = 0.0\n    else:\n        precision = tp / (tp + fp)\n    if tp + fn == 0:\n        recall = 0.0\n    else:\n        recall = tp / (tp + fn)\n    print(f\"{name:>12}  accuracy {accuracy:.3f}  precision {precision:.2f}  recall {recall:.2f}\")\n\nreport(\"flags nothing\", 0, 0, 10, 990)\nreport(\"real model\",    7, 13,  3, 977)\n\n# flags nothing  accuracy 0.990  precision 0.00  recall 0.00\n#   real model  accuracy 0.984  precision 0.35  recall 0.70\n#\n# The useful model has the LOWER accuracy. It found seven of the ten faults and\n# sent thirteen engineers out for nothing. The 99 per cent model found none.", "caption": "Same four counts, three different numbers computed from them. Only two of the three are informative here."}, {"type": "prose", "html": "<p>The two numbers that survive the imbalance:<\/p>\n<ul>\n<li><strong>Precision<\/strong> is true positives divided by everything you flagged. When it shouts, how often is it right. Poor precision wastes other people's time.<\/li>\n<li><strong>Recall<\/strong> is true positives divided by everything that was really positive. Of all the faults out there, how many did it find. Poor recall means the thing you built it for is still happening and nobody knows.<\/li>\n<\/ul>\n<p>Notice what happened to the do-nothing model. No true positives at all, so precision and recall are both zero and the model is exposed in one line, which accuracy never managed. Notice too that neither number involves true negatives, which is exactly why they survive a 990-to-10 split: the enormous easy pile cannot inflate them.<\/p>\n<p>Now the part that is a judgement call rather than a calculation. Precision and recall pull against each other through the threshold from lesson 6. Lower the threshold and you flag more meters: recall climbs, precision falls. Raise it and you flag only the obvious ones: precision climbs, recall falls. There is no setting that maximises both, and which one you favour is a question about the world. Screening for a disease where a missed case is fatal and a false alarm means one more test: take recall. An automatic spam filter where a false positive deletes somebody's job offer: take precision. Flagging meters: compare the cost of a wasted van against the cost of an unnoticed fault, and ask the facilities manager, who knows both.<\/p>\n<p>People often ask for one number anyway, and the usual answer is the F1 score, the harmonic mean of precision and recall, which is low unless both are decent. It is a reasonable default and it is still a choice -- it declares the two mistakes equally bad, which is rarely true. In a real job <code>classification_report<\/code> from scikit-learn prints all of this for you, which is precisely why counting the four boxes by hand once is worth the ten minutes: you will read that table knowing what every number in it is made of.<\/p>"}, {"type": "code", "code": "# One model, one set of scores, three thresholds. Nothing is retrained.\nscores = [0.95, 0.90, 0.80, 0.60, 0.45, 0.30, 0.20, 0.10]\nlabels = [   1,    1,    0,    1,    0,    0,    0,    0]\n\nfor t in [0.85, 0.50, 0.15]:\n    preds = []\n    for s in scores:\n        if s >= t:\n            preds.append(1)\n        else:\n            preds.append(0)\n    tp, fp, fn, tn = counts(preds, labels)\n    report(f\"cut at {t:.2f}\", tp, fp, fn, tn)\n\n# cut at 0.85  accuracy 0.875  precision 1.00  recall 0.67\n# cut at 0.50  accuracy 0.875  precision 0.75  recall 1.00\n# cut at 0.15  accuracy 0.500  precision 0.43  recall 1.00\n#\n# Flag only what it is sure about and everything you flag is real, but you miss\n# a third of the faults. Flag everything that twitches and you catch them all,\n# with four wasted visits. Same model throughout: this is a dial, not a bug.", "caption": "The threshold is the dial between the two kinds of mistake. Set it on purpose."}, {"type": "callout", "kind": "warn", "title": "Decide which mistake you can live with before you see the numbers", "body": "Pick the metric that matters while you still have no results, and write down why. Afterwards, every metric is a story you can tell about a model you have grown fond of, and there is always one number that flatters it. Two more habits worth keeping. Say what the threshold was whenever you quote precision or recall, because both numbers are meaningless without it. And when someone tells you a model is 95 per cent accurate, ask two questions: accurate on which class, and how rare is the class you care about. If they cannot answer the second one, they have not measured anything yet."}], "exercise": {"brief": "Write a function named precision_recall that takes a list of predicted 0s and 1s and a list of true 0s and 1s of the same length, and returns the pair (precision, recall) for class 1. Precision is the fraction of the rows you predicted as 1 that really were 1; recall is the fraction of the real 1s that you predicted as 1. Where a denominator would be zero -- you predicted no 1s at all, or there are no real 1s -- return 0.0 for that number instead of dividing.", "starter": "def precision_recall(preds, labels):\n    right = 0\n    for i in range(len(preds)):\n        if preds[i] == labels[i]:\n            right = right + 1\n    acc = right / len(preds)\n    return (acc, acc)       # this is accuracy twice, which is the whole problem\n", "solution": "def precision_recall(preds, labels):\n    tp = 0\n    fp = 0\n    fn = 0\n    for i in range(len(preds)):\n        if preds[i] == 1 and labels[i] == 1:\n            tp = tp + 1\n        elif preds[i] == 1:\n            fp = fp + 1\n        elif labels[i] == 1:\n            fn = fn + 1\n\n    if tp + fp == 0:\n        precision = 0.0\n    else:\n        precision = tp / (tp + fp)\n\n    if tp + fn == 0:\n        recall = 0.0\n    else:\n        recall = tp / (tp + fn)\n\n    return (precision, recall)\n", "tests": [{"label": "one hit, one false alarm, one miss", "expr": "(lambda r: abs(r[0] - 0.5) < 1e-9 and abs(r[1] - 0.5) < 1e-9)(precision_recall([1, 1, 0, 0], [1, 0, 0, 1]))"}, {"label": "flagging nothing scores zero on both, though accuracy is 0.75", "expr": "(lambda r: abs(r[0]) < 1e-9 and abs(r[1]) < 1e-9)(precision_recall([0, 0, 0, 0], [0, 0, 1, 0]))"}, {"label": "flagging everything gives full recall and poor precision", "expr": "(lambda r: abs(r[0] - 0.25) < 1e-9 and abs(r[1] - 1.0) < 1e-9)(precision_recall([1, 1, 1, 1], [1, 0, 0, 0]))"}, {"label": "perfect predictions", "expr": "(lambda r: abs(r[0] - 1.0) < 1e-9 and abs(r[1] - 1.0) < 1e-9)(precision_recall([1, 0, 1], [1, 0, 1]))"}, {"label": "two empty lists", "expr": "(lambda r: len(r) == 2 and abs(r[0]) < 1e-9 and abs(r[1]) < 1e-9)(precision_recall([], []))"}, {"label": "no real 1s to find", "expr": "(lambda r: abs(r[0]) < 1e-9 and abs(r[1]) < 1e-9)(precision_recall([1, 0], [0, 0]))"}]}}, {"id": "ai-01", "track": "ai", "order": 1, "title": "One neuron, by hand", "blurb": "A pump monitor has to turn two readings into one yes-or-no, and the entire machine is a weighted sum and a threshold.", "minutes": 14, "objectives": ["Compute a neuron's output on paper from inputs, weights and a bias", "Explain what the bias does and why it is not optional", "Write a perceptron as a loop over two lists"], "sections": [{"type": "prose", "html": "<p>A pump has two sensors on it. One reports how many degrees above normal it is running, the other how hard it is vibrating in millimetres per second. Someone has to decide, from those two numbers, whether to shut it down. Shut it down too often and the line stops for nothing; too rarely and you replace a pump.<\/p>\n<p>You already know most of this. In the regression track you scored a thing by multiplying each feature by a weight and adding the results up. That is the first half of a neuron. The second half is one extra step: compare the score to a threshold and answer 1 or 0.<\/p>\n<p>Say temperature matters a
