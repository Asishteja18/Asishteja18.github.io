<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyML — standalone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap">
<style>
/* PyML — warm premium palette: brown and gold on paper by day, black, grey
   and gold at night. Components only ever read tokens, never literals, so the
   two themes stay in step. */
:root{
  --bg:#EDE7DA; --muted:#E2D9C6; --line:rgba(62,44,22,.16);
  --fg:#2A1F12; --fg-2:#5C4A33; --fg-3:#6F5D44;
  --gold:#7D560C; --gold-strong:#59400A; --gold-ink:#FFFCF5; --gold-soft:rgba(125,86,12,.11);
  --gold-line:rgba(125,86,12,.34);
  --brown:#7A4A1E; --brown-soft:rgba(122,74,30,.10); --brown-line:rgba(122,74,30,.32);
  --ok:#2F6B40; --on-ok:#FFFFFF; --ok-soft:rgba(47,107,64,.12); --ok-line:rgba(47,107,64,.38);
  --bad:#A33224; --bad-soft:rgba(163,50,36,.10); --bad-line:rgba(163,50,36,.36);
  --code-bg:#2A2218; --code-fg:#EDE3D2; --code-inline:#6B4A10; --prose:#3E3022;
  --snake-dark:#4A330A; --snake-mid:#8A6011; --snake-light:#D8B35C;
  --card:rgba(255,252,245,.78); --glass:saturate(1.3) blur(16px);
  --glow:rgba(125,86,12,.34); --glow-2:rgba(122,74,30,.20);
  --amb-1:rgba(201,150,40,.20); --amb-2:rgba(122,74,30,.14);
  --shadow:0 1px 2px rgba(50,35,15,.07), 0 10px 26px -18px rgba(50,35,15,.4);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Sora","Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0A08; --muted:#201C14; --line:rgba(240,220,170,.12);
    --fg:#F3EEE3; --fg-2:#B5AC98; --fg-3:#9A9180;
    --gold:#E7B64E; --gold-strong:#F0C66A; --gold-ink:#1A1304; --gold-soft:rgba(231,182,78,.12);
    --gold-line:rgba(231,182,78,.36);
    --brown:#C08A4A; --brown-soft:rgba(192,138,74,.11); --brown-line:rgba(192,138,74,.32);
    --ok:#6FBE7E; --on-ok:#0B0A08; --ok-soft:rgba(111,190,126,.11); --ok-line:rgba(111,190,126,.36);
    --bad:#E4756A; --bad-soft:rgba(228,117,106,.10); --bad-line:rgba(228,117,106,.36);
    --code-bg:#050504; --code-fg:#E6DCC8; --code-inline:#F0C977; --prose:#D8D0C0;
    --snake-dark:#6B4A0C; --snake-mid:#B07F22; --snake-light:#F0CE82;
    --card:rgba(32,28,20,.66); --glass:saturate(1.25) blur(18px);
    --glow:rgba(231,182,78,.40); --glow-2:rgba(192,138,74,.26);
    --amb-1:rgba(231,182,78,.13); --amb-2:rgba(192,138,74,.10);
    --shadow:0 1px 2px rgba(0,0,0,.6), 0 12px 32px -20px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0A08; --muted:#201C14; --line:rgba(240,220,170,.12);
  --fg:#F3EEE3; --fg-2:#B5AC98; --fg-3:#9A9180;
  --gold:#E7B64E; --gold-strong:#F0C66A; --gold-ink:#1A1304; --gold-soft:rgba(231,182,78,.12);
  --gold-line:rgba(231,182,78,.36);
  --brown:#C08A4A; --brown-soft:rgba(192,138,74,.11); --brown-line:rgba(192,138,74,.32);
  --ok:#6FBE7E; --on-ok:#0B0A08; --ok-soft:rgba(111,190,126,.11); --ok-line:rgba(111,190,126,.36);
  --bad:#E4756A; --bad-soft:rgba(228,117,106,.10); --bad-line:rgba(228,117,106,.36);
  --code-bg:#050504; --code-fg:#E6DCC8; --code-inline:#F0C977; --prose:#D8D0C0;
  --snake-dark:#6B4A0C; --snake-mid:#B07F22; --snake-light:#F0CE82;
    --card:rgba(32,28,20,.66); --glass:saturate(1.25) blur(18px);
    --glow:rgba(231,182,78,.40); --glow-2:rgba(192,138,74,.26);
    --amb-1:rgba(231,182,78,.13); --amb-2:rgba(192,138,74,.10);
  --shadow:0 1px 2px rgba(0,0,0,.6), 0 12px 32px -20px rgba(0,0,0,.95);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1.22;
  text-wrap:balance;font-weight:650;letter-spacing:-.018em}
p{margin:0}
code,pre,.mono{font-family:var(--mono);font-variant-ligatures:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:5px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ------------------------------------------------------------- controls */
.btn{background:var(--gold);color:var(--gold-ink);font-weight:650;font-size:14px;
  padding:9px 20px;border-radius:12px;transition:filter .18s,transform .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg-2);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:6px 13px;font-size:12.5px;min-height:32px}
.btn.danger{background:transparent;border:1px solid var(--bad-line);color:var(--bad)}
label{display:block;font-size:12.5px;color:var(--fg-2);margin-bottom:6px;font-weight:500}
input[type=email],input[type=password],input[type=text]{width:100%;background:var(--muted);
  border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:11px 13px;
  font:inherit;font-size:14.5px;min-height:44px}
input:focus{outline:0;border-color:var(--gold)}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:19px}
.note{color:var(--fg-3);font-size:13px}

/* ------------------------------------------------------------- top bar */
.bar{display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);
  font-weight:700;letter-spacing:-.02em}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 11px var(--gold)}
.bar .sp{margin-left:auto}
.who{font-family:var(--mono);font-size:11.5px;color:var(--fg-3)}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--fg-2)}
.tag.demo{color:var(--brown);border-color:var(--brown-line);background:var(--brown-soft)}
.tag.ok{color:var(--gold);border-color:var(--ok-line);background:var(--gold-soft)}

/* ------------------------------------------------------------- auth card */
.centre{display:grid;place-items:center;min-height:100vh;padding:28px 18px}
.auth{width:100%;max-width:400px}
.auth .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);
  font-size:20px;font-weight:700;
  letter-spacing:-.02em;margin-bottom:6px}
.auth .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 12px var(--gold)}
.auth .lede{color:var(--fg-2);font-size:14.5px;margin-bottom:24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.tabs{display:flex;gap:4px;background:var(--muted);border:1px solid var(--line);
  border-radius:13px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;padding:8px;border-radius:6px;font-size:13.5px;color:var(--fg-2);
  transition:background .18s,color .18s}
.tabs button[aria-selected=true]{background:var(--card);color:var(--fg);font-weight:600}
.field{margin-bottom:14px}
.auth .btn{width:100%;margin-top:4px}
.pending{text-align:center}
.pending .ring{width:52px;height:52px;border-radius:50%;margin:0 auto 16px;
  border:2px solid var(--brown-line);border-top-color:var(--brown);
  animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pending h2{font-size:19px;margin-bottom:8px}
.pending p{color:var(--fg-2);font-size:14.5px;max-width:34ch;margin:0 auto 18px}

/* ------------------------------------------------------------- tracks */
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
.head{margin-bottom:24px}
.head h1{font-size:27px;letter-spacing:-.02em;margin-bottom:6px}
.head p{color:var(--fg-2);max-width:60ch}
.meter{display:flex;align-items:center;gap:12px;margin-top:14px}
.meter .track{flex:1;height:7px;background:var(--muted);border-radius:4px;overflow:hidden;max-width:300px}
.meter .track i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .5s}
.meter .n{font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;width:100%;text-align:left;transition:border-color .18s}
.row:hover{border-color:var(--gold-line)}
.row .num{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);
  background:var(--muted);border:1px solid var(--line);border-radius:11px;padding:5px 9px}
.row.done .num{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.row .rtitle{font-weight:600;font-size:16px}
.row .b{color:var(--fg-2);font-size:13.5px;margin-top:2px}
.row .m{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);white-space:nowrap}

/* ------------------------------------------------------------- lesson */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100vh - 53px)}
.pane{padding:26px 24px 56px;min-width:0}
.pane.lesson{border-right:1px solid var(--line)}
.kicker{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--gold-strong);background:var(--gold-soft);
  border:1px solid var(--gold-line);padding:5px 11px;border-radius:999px;margin-bottom:13px}
.lesson h1{font-size:28px;letter-spacing:-.022em;margin-bottom:8px}
.lesson .sub{color:var(--fg-2);font-size:15.5px;max-width:58ch;margin-bottom:22px}
.obj{background:var(--muted);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:22px}
.obj h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--fg-3);font-weight:600;margin-bottom:8px;border:0;padding:0}
.obj ul{margin:0;padding-left:17px;color:var(--prose);font-size:14px}
.lesson p{margin:0 0 13px;max-width:62ch;color:var(--prose)}
.lesson ul,.lesson ol{max-width:62ch;color:var(--prose);padding-left:20px}
.lesson code:not(pre code){background:var(--muted);border:1px solid var(--line);
  padding:1.5px 6px;border-radius:5px;font-size:13px;color:var(--code-inline)}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:14px;padding:15px 17px;
  overflow-x:auto;font-size:13.2px;line-height:1.72;margin:0 0 15px;color:var(--code-fg)}
.cap{font-family:var(--mono);font-size:11px;color:var(--fg-3);margin:0 0 6px}
.callout{border-radius:14px;padding:13px 16px;margin:4px 0 15px;font-size:14.2px}
.callout b{display:block;margin-bottom:3px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase}
.callout.warn{background:var(--brown-soft);border:1px solid var(--brown-line);color:var(--fg)}
.callout.warn b{color:var(--brown)}
.callout.tip{background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--fg)}
.callout.tip b{color:var(--gold)}

/* ------------------------------------------------------------- practice */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.ptitle{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-3)}
.status{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);display:flex;align-items:center;gap:7px}
.status .led{width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none}
.status.ready .led{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.status.fail .led{background:var(--bad)}
.brief{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--gold);
  border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:14px;font-size:14.3px;color:var(--fg-2)}
.editor{background:var(--code-bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ehead{display:flex;align-items:center;padding:8px 13px;border-bottom:1px solid var(--line);
  background:var(--muted);font-family:var(--mono);font-size:11.5px;color:var(--fg-2)}
textarea{width:100%;min-height:230px;background:transparent;color:var(--code-fg);border:0;padding:14px 16px;
  font-family:var(--mono);font-size:13.2px;line-height:1.72;resize:vertical;display:block;tab-size:4}
textarea:focus{outline:0}
.erow{display:flex;gap:9px;padding:11px 13px;border-top:1px solid var(--line);
  background:var(--muted);align-items:center;flex-wrap:wrap}
kbd{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.tests{margin-top:15px;display:grid;gap:7px}
.t{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 13px}
.t .ic{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--fg-3);
  display:grid;place-items:center;flex:none}
.t .ic svg{width:9px;height:9px;opacity:0}
.t.pass{border-color:var(--ok-line);background:var(--ok-soft)}
.t.pass .ic{background:var(--gold);border-color:var(--gold)}
.t.pass .ic svg{opacity:1}
.t.fail{border-color:var(--bad-line);background:var(--bad-soft)}
.t.fail .ic{border-color:var(--bad)}
.t .lab{font-family:var(--mono);font-size:12.6px;color:var(--fg-2);overflow-wrap:anywhere}
.t.pass .lab,.t.fail .lab{color:var(--fg)}
.t .got{font-family:var(--mono);font-size:11.5px;color:var(--bad);text-align:right}
.out{margin-top:13px;background:var(--code-bg);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;font-family:var(--mono);font-size:12.6px;color:var(--fg-2);
  white-space:pre-wrap;overflow-x:auto;min-height:46px;overflow-wrap:anywhere}
.out:empty::before{content:"Run your code to see output here.";color:var(--fg-3)}
.out .e{color:var(--bad)}
.done{margin-top:14px;background:var(--gold-soft);border:1px solid var(--ok-line);
  border-radius:14px;padding:14px 16px;font-size:14.3px}
.done b{color:var(--gold)}

/* ------------------------------------------------------------- admin */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--fg-3);font-weight:600;padding:0 12px 10px}
td{padding:12px;border-top:1px solid var(--line)}
td.email{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px;overflow-x:auto}
.empty{color:var(--fg-3);text-align:center;padding:30px 0;font-size:14px}

@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .pane.lesson{border-right:0;border-bottom:1px solid var(--line)}
  .pane{padding:22px 17px 40px}
  .row{grid-template-columns:auto 1fr}
  .row .m{grid-column:2;margin-top:2px}
}

/* ------------------------------------------------------- demo logins */
.demo-logins{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:9px}
.demo-logins>.note{margin-bottom:2px}
.demo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo-row .btn{font-family:var(--mono);font-size:11.5px}
.demo-row .note{font-size:12px}

/* ------------------------------------------------------------- landing */
.landing{max-width:1120px;margin:0 auto;padding:48px 20px 72px;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:56px;align-items:start}
.pitch h1{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.025em;margin-bottom:14px;max-width:18ch}
.pitch .big{color:var(--fg-2);font-size:17px;max-width:48ch;margin-bottom:34px}
.pitch h2{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--fg-3);font-weight:600;margin-bottom:14px}
.why{margin-bottom:34px;display:grid;gap:14px}
.whyrow{display:grid;gap:3px}
.whyrow b{font-size:15px;font-weight:650}
.whyrow span{color:var(--fg-2);font-size:14.5px;max-width:52ch}
.path{display:grid;gap:2px;margin-bottom:26px}
.step{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:16px 0;
  border-top:1px solid var(--line)}
.step:last-child{border-bottom:1px solid var(--line)}
.stepn{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.07em;
  padding-top:3px;white-space:nowrap}
.step h3{font-size:16.5px;margin-bottom:4px}
.step p{color:var(--fg-2);font-size:14.5px;max-width:50ch}
.closer{font-family:var(--mono);font-size:13px;color:var(--fg-3);max-width:48ch}
.landing .auth{position:sticky;top:28px;max-width:420px;justify-self:end;width:100%}

/* ------------------------------------------------------------- groups */
.group{margin-bottom:38px}
.ghead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.part{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);display:block;margin-bottom:5px}
.ghead h2{font-size:20px;letter-spacing:-.015em}
.gwhy{color:var(--fg-2);font-size:14px;margin-top:5px;max-width:62ch}
.gcount{font-family:var(--mono);font-size:13px;color:var(--fg-3);
  font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:14px}

@media (max-width:980px){
  .landing{grid-template-columns:1fr;gap:38px;padding:30px 18px 56px}
  .landing .auth{position:static;justify-self:stretch;max-width:none}
}

/* ------------------------------------------------- collapsing sections */
.sect{border:1px solid var(--line);border-radius:22px;background:var(--card);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.secthead{display:flex;align-items:center;gap:13px;width:100%;padding:17px 20px;
  text-align:left;min-height:58px;transition:background .2s;position:relative}
.secthead::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;
  background:var(--line);opacity:0;transition:opacity .2s}
.sect.open .secthead::after{opacity:1}
.secthead:hover{background:var(--gold-soft)}
.caret{width:13px;height:13px;color:var(--fg-3);flex:none;display:grid;place-items:center;
  transition:transform .3s cubic-bezier(.22,1,.36,1),color .2s}
.caret svg{width:13px;height:13px}
.sect.open .caret{transform:rotate(90deg);color:var(--gold)}
.secttitle{font-family:var(--display);font-weight:700;font-size:17.5px;
  letter-spacing:-.015em;flex:1;min-width:0}
.sectcount{font-family:var(--mono);font-size:12px;color:var(--fg-3);
  font-variant-numeric:tabular-nums}

/* --------------------------------------------------------- the python */
.road{position:relative;display:none;width:100%}
.sect.open .road{display:block}
svg.snake{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
.snake .ahead{stroke:var(--line)}
.peakdot{fill:var(--bg);stroke:var(--line);stroke-width:2}
.peakdot.on{fill:var(--gold);stroke:var(--gold)}
.snakebody{filter:drop-shadow(0 3px 10px rgba(0,0,0,.28))}
.snakesheen{mix-blend-mode:screen;opacity:.5}
.headshape{filter:drop-shadow(0 0 16px var(--glow))}
.snakehead .eye{fill:#0B0A08}
.snakehead .tongue{stroke:#C4443A}

/* ------------------------------------------------------- topics on peaks */
.peak{position:absolute;transform:translateY(-50%);z-index:1;width:min(320px,34%)}
.peak.left{right:calc(100% - var(--peakx) + 34px)}
.peak.right{left:calc(var(--peakx) + 34px)}
.peakcard{width:100%;text-align:left;display:grid;gap:5px;padding:14px 16px;
  border-radius:16px;border:1px solid var(--line);background:var(--card);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  transition:transform .24s cubic-bezier(.22,1,.36,1),box-shadow .24s,
             border-color .24s,opacity .24s}
.peaktop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.peakno{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
  border:1.5px solid var(--line);font-family:var(--mono);font-size:11px;font-weight:600;
  color:var(--fg-3);background:var(--muted)}
.peakno svg{width:13px;height:13px}
.peaktop .m{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.peakcard .rtitle{font-family:var(--display);font-weight:650;font-size:15.5px;
  letter-spacing:-.012em;line-height:1.25}
.peakcard .b{color:var(--fg-2);font-size:12.8px;line-height:1.45}

/* cleared: receded, still legible */
.peak.past .peakcard{opacity:.52}
.peak.past .peakno{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.peak.past:hover .peakcard{opacity:1}

/* where you are: lit */
.peak.live{width:min(348px,37%)}
.peak.live .peakcard{border-color:var(--gold);background:var(--gold-soft);
  box-shadow:0 0 44px -12px var(--glow),0 0 0 1px var(--gold-line)}
.peak.live .peakno{border-color:var(--gold);color:var(--gold);
  box-shadow:0 0 0 4px var(--gold-soft)}

/* not yet: glossy, hazy, deliberately quieter. The haze is a sheen layer over
   the card, never a blur on the text, which would make it unreadable. */
.peak.ahead .peakcard{opacity:.72;position:relative;overflow:hidden}
.peak.ahead .peakcard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.03) 38%,
             transparent 60%),var(--gold-soft);
  backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px)}
.peak.ahead:hover .peakcard{opacity:1}
.peak.ahead:hover .peakcard::after{opacity:.35}

.peakcard:hover{transform:translateY(-3px);border-color:var(--gold-line);
  box-shadow:0 0 40px -14px var(--glow)}

@media (max-width:760px){
  /* one column: the serpentine tightens into the left gutter */
  .peak,.peak.live{width:calc(100% - 86px);left:78px;right:auto}
  .peak.right{left:78px;right:auto}
  .peakcard{padding:12px 14px}
  .peakcard .rtitle{font-size:14.5px}
  .secthead{padding:15px 16px}
}

/* ------------------------------------------------------- coming soon */
.soon{background:var(--card);border:1px dashed var(--line);border-radius:18px;
  padding:18px 20px;margin-bottom:14px}
.soontop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  margin-bottom:8px}
.soon h2{font-size:18px;color:var(--fg-2)}
.soon .gwhy{margin-bottom:8px}
.soon .tag{white-space:nowrap;color:var(--brown);border-color:var(--brown-line);
  background:var(--brown-soft)}

@media (max-width:560px){
  .stop{grid-template-columns:30px 1fr;gap:10px}
  .stop::before{left:7px}
  .sect .map{padding:2px 12px 14px}
  .secthead{padding:14px}
}


/* ------------------------------------------------- glass, glow, ambience */
body{position:relative}
/* something for the glass to actually blur */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(52rem 38rem at 12% -6%, var(--amb-1), transparent 62%),
    radial-gradient(44rem 34rem at 92% 22%, var(--amb-2), transparent 60%),
    radial-gradient(38rem 30rem at 48% 108%, var(--amb-1), transparent 58%)}

.card,.stopcard,.panel,.soon,.tblwrap,.editor,.brief,.obj,.out{
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.bar{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}

/* ------------------------------------------------------------- the hub */
.hubwrap{padding-top:34px}
.cubes{display:flex;align-items:stretch;justify-content:center;gap:0;flex-wrap:nowrap;
  margin:30px 0 26px}
.cube{flex:1 1 0;min-width:0;max-width:260px;aspect-ratio:1/1;
  background:var(--card);border:1px solid var(--line);border-radius:26px;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
  gap:4px;padding:22px;text-align:left;position:relative;overflow:hidden;
  transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s,border-color .28s}
.cube .glyph{position:absolute;top:20px;left:20px;width:36px;height:36px;color:var(--fg-3);
  transition:color .28s,transform .28s}
.cube .glyph svg{width:100%;height:100%}
.cubebody{display:contents}
.cubenum{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg-3)}
.cubetitle{font-family:var(--display);font-size:19px;font-weight:650;
  line-height:1.2;letter-spacing:-.02em}
.cubemeta{font-family:var(--mono);font-size:11px;color:var(--fg-3);margin-bottom:8px}
.cubetag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--fg-3)}

.cube.open{cursor:pointer;border-color:var(--gold-line);
  box-shadow:0 0 34px -14px var(--glow), inset 0 1px 0 var(--gold-soft)}
.cube.open .glyph{color:var(--gold)}
.cube.open .cubetag.go{color:var(--gold-ink);background:var(--gold);border-color:var(--gold)}
.cube.open:hover,.cube.open:focus-visible{transform:translateY(-6px);
  border-color:var(--gold);
  box-shadow:0 0 62px -8px var(--glow), 0 0 0 1px var(--gold-line),
             inset 0 1px 0 var(--gold-soft)}
.cube.open:hover .glyph{transform:scale(1.08)}
.cube.open:active{transform:translateY(-2px)}

.cube.locked{opacity:.66;border-style:dashed}
.cube.locked:hover{opacity:.9;box-shadow:0 0 36px -16px var(--glow-2)}
.cube.locked .cubetag{color:var(--brown);border-color:var(--brown-line);
  background:var(--brown-soft)}

/* the interlocking path between stages */
.link{flex:0 0 46px;align-self:center;height:2px;background:var(--line);position:relative}
.link::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;
  transform:translate(-50%,-50%) rotate(45deg);
  background:var(--bg);border:2px solid var(--line);border-radius:3px}
.link.live{background:var(--gold-line)}
.link.live::after{border-color:var(--gold);box-shadow:0 0 14px -2px var(--glow)}

.hubnote{color:var(--fg-3);font-size:13.5px;max-width:62ch;margin:0 auto;text-align:center}

.backlink{font-family:var(--mono);font-size:12px;color:var(--fg-3);padding:6px 0;
  margin-bottom:10px;transition:color .18s}
.backlink:hover{color:var(--gold)}

@media (max-width:760px){
  .cubes{flex-direction:column;align-items:stretch;gap:0}
  .cube{max-width:none;aspect-ratio:auto;min-height:150px}
  .link{flex:0 0 34px;width:2px;height:34px;align-self:center}
}

/* ------------------------------------------------- motion and loading */
@keyframes viewIn{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
@keyframes riseIn{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}

/* every view fades up as it mounts; `translate` is used instead of `transform`
   so hover lifts on cubes and cards still work afterwards */
.wrap,.grid,.centre,.landing{animation:viewIn .34s cubic-bezier(.22,1,.36,1) both}
.peak,.cube{animation:riseIn .44s cubic-bezier(.22,1,.36,1) both}

.spin{width:14px;height:14px;border-radius:50%;flex:none;box-sizing:border-box;
  border:2px solid currentColor;border-top-color:transparent;
  animation:spin .72s linear infinite;display:inline-block}
.spin.lg{width:34px;height:34px;border-width:3px}
.status .spin{width:11px;height:11px;border-width:2px;color:var(--gold)}
.btn .spin{color:currentColor}

.boot{min-height:70vh;display:grid;place-items:center;gap:16px;
  grid-auto-flow:row;justify-items:center;color:var(--fg-3)}
.boot .spin{color:var(--gold)}
.boot span{font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  animation:pulse 1.8s ease-in-out infinite}

.skel{background:var(--card);border:1px solid var(--line);border-radius:16px;
  height:74px;animation:pulse 1.5s ease-in-out infinite}
.skelwrap{display:grid;gap:10px;margin-top:18px}

/* ------------------------------------------------------------- mobile */
.ltabs{display:none}

@media (max-width:900px){
  /* the bar costs 108px pinned on a phone and buries headings underneath it;
     the tab switch is the control that actually needs to stay reachable */
  .bar{position:static}
  .grid{grid-template-rows:auto 1fr}
  .ltabs{display:flex;gap:5px;position:sticky;top:0;z-index:6;
    padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--line);
    backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
  .ltab{flex:1;padding:10px;border-radius:12px;font-size:13.5px;font-weight:600;
    color:var(--fg-3);border:1px solid transparent;min-height:42px;
    transition:background .18s,color .18s,border-color .18s}
  .ltab.on{background:var(--card);color:var(--fg);border-color:var(--gold-line)}
  .grid:not(.practice) .pane:last-child{display:none}
  .grid.practice .pane.lesson{display:none}
  .pane{padding-top:18px}
  textarea{min-height:300px}
}

@media (max-width:620px){
  /* one row, not two: the signed-in address and mode chip are not worth 54px */
  .bar .whoname,.bar .tag{display:none}
  .bar{padding:10px 14px;gap:9px}
}

@media (max-width:760px){
  /* the glyph is absolute on desktop and collides with the stage label once
     the cube collapses to a short row */
  .cube{flex-direction:row;align-items:center;justify-content:flex-start;
    gap:16px;padding:18px 20px;min-height:96px;aspect-ratio:auto;overflow:visible}
  .cube .glyph{position:static;width:30px;height:30px;flex:none}
  .cube .cubebody{display:flex;flex-direction:column;align-items:flex-start;
    gap:2px;min-width:0;flex:1}
  .cubemeta{margin-bottom:0}
  .cubetag{margin-top:7px}
}

/* ------------------------------------------------------- profile panel */
.menubtn{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;
  color:var(--fg-2);border:1px solid var(--line);transition:color .2s,border-color .2s,background .2s}
.menubtn:hover{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.menubtn svg{width:17px;height:17px}

.whobtn{display:flex;align-items:center;gap:10px;padding:4px 11px 4px 4px;
  border-radius:999px;border:1px solid transparent;
  transition:border-color .2s,background .2s}
.whotext{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.whoname{font-family:var(--display);font-weight:650;font-size:13.5px;
  letter-spacing:-.01em;text-transform:capitalize;color:var(--fg)}
.whobtn .who{color:var(--gold-strong);font-size:10.5px;letter-spacing:.04em}
.whobtn:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.meav{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--gold);color:var(--gold-ink);font-family:var(--display);
  font-weight:700;font-size:12.5px;box-shadow:0 0 14px -4px var(--glow)}

.scrim{position:fixed;inset:0;background:rgba(16,11,3,.46);opacity:0;pointer-events:none;
  transition:opacity .28s;z-index:19}
.scrim.on{opacity:1;pointer-events:auto}

.mepanel{position:fixed;top:0;left:0;bottom:0;z-index:20;width:min(364px,89vw);
  display:flex;flex-direction:column;gap:14px;padding:20px 18px 22px;overflow-y:auto;
  background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border-right:1px solid var(--gold-line);box-shadow:26px 0 64px -30px rgba(28,18,4,.62);
  transform:translateX(-102%);visibility:hidden;
  transition:transform .34s cubic-bezier(.22,1,.36,1),visibility .34s}
.mepanel.open{transform:none;visibility:visible}

.mehead{display:flex;align-items:center;gap:12px}
.mehead .meav{width:44px;height:44px;font-size:18.5px}
.mewho{display:flex;flex-direction:column;min-width:0;flex:1}
.mename{font-family:var(--display);font-weight:700;font-size:16.5px;
  letter-spacing:-.015em;text-transform:capitalize}
.memail{font-family:var(--mono);font-size:11px;color:var(--fg-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mex{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  color:var(--fg-3);border:1px solid var(--line);transition:color .2s,border-color .2s}
.mex:hover{color:var(--gold);border-color:var(--gold)}
.mex svg{width:14px;height:14px}

.mechips{display:flex;gap:7px;flex-wrap:wrap}

.mestats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mestat{border:1px solid var(--gold-line);border-radius:14px;padding:11px 8px;
  text-align:center;background:var(--gold-soft)}
.mestat b{display:block;font-family:var(--display);font-weight:700;font-size:19px;
  color:var(--gold-strong);font-variant-numeric:tabular-nums;line-height:1.2}
.mestat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--fg-2)}

.mebody{flex:1}
.mepanel .sect{border-radius:16px;margin-bottom:9px;box-shadow:none}
.mepanel .secthead{padding:13px 15px;min-height:46px;gap:11px}
.mepanel .secttitle{font-size:14.5px}
.melist{display:none;padding:4px 9px 11px;list-style:none}
.mepanel .sect.open .melist{display:block}
.meitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:8px 10px;border-radius:11px;min-height:38px;transition:background .18s}
.meitem:hover:not(:disabled){background:var(--gold-soft)}
.medot{width:7px;height:7px;border-radius:50%;flex:none;border:1.5px solid var(--line)}
.metitle{font-size:13.2px;color:var(--fg-2);line-height:1.3}
.meitem.cleared .medot{background:var(--gold);border-color:var(--gold)}
.meitem.cleared .metitle{text-decoration:line-through;text-decoration-thickness:1.5px;
  text-decoration-color:var(--gold)}
.meitem.now .medot{background:var(--gold);border-color:var(--gold);
  box-shadow:0 0 0 4px var(--gold-soft)}
.meitem.now .metitle{color:var(--fg);font-weight:650}
.meitem.off{opacity:.52;cursor:not-allowed}

.mefoot{display:flex;gap:8px;padding-top:4px}
.mefoot .btn{flex:1;text-align:center;justify-content:center}

/* a cleared stop reads as struck off the list, on the map too. The card sits
   at .52 opacity, so the rule needs solid gold to survive it. */
.peak.past .rtitle{text-decoration:line-through;text-decoration-thickness:2px;
  text-decoration-color:var(--gold)}

@media (max-width:620px){
  /* the name goes, the streak stays — it is the thing worth a daily glance */
  .whobtn{padding:3px 9px 3px 3px;gap:7px}
  .mepanel{padding:16px 14px 18px}
}

<script type="module">
const __LESSONS__ = [{"id": "py-01", "track": "python", "order": 3, "title": "Running Python and your first values", "blurb": "A spreadsheet cell that looks like a number usually isn't one, and Python will tell you so in the rudest possible way.", "minutes": 12, "section": "Introduction", "objectives": ["Print values and read what Python prints back", "Assign and reassign variables without losing track of what they hold", "Tell int, float and str apart, and convert between them"], "sections": [{"type": "prose", "html": "<p>Here are two temperature readings, copied out of a file: <code>\"19.5\"<\/code> and <code>\"20.1\"<\/code>. Add them together and Python gives you <code>\"19.520.1\"<\/code>.<\/p>\n<p>Nothing is broken. Those quote marks mean the values are <em>text<\/em>, and adding text together glues it end to end. For Python, <code>19.5<\/code> and <code>\"19.5\"<\/code> are different kinds of thing with different rules, and knowing which one you are holding is most of what keeps early data work from going sideways. Files, web pages and spreadsheet exports hand you text. Arithmetic, averages and eventually any model you train need numbers. The conversion step is yours.<\/p>\n<p>So: values, names for values, and the type of a value. That is this whole lesson.<\/p>"}, {"type": "code", "code": "print(\"hello\")\nprint(19.5 + 20.1)\n\n# A name on the left, a value on the right.\nreadings_taken = 3\nsensor = \"roof-01\"\ntemperature = 19.5\n\nprint(sensor, temperature, readings_taken)\nprint(temperature * 2)", "caption": "Run this top to bottom. print shows you a value; = gives a value a name."}, {"type": "prose", "html": "<p><code>=<\/code> is not the equals sign from maths. It does not state a fact, it performs an action: evaluate the thing on the right, then make the name on the left refer to it. Read it as <em>\"gets\"<\/em>. <code>temperature = 19.5<\/code> means \"temperature gets 19.5\".<\/p>\n<p>Because it is an action, you can do it again. A name is a label you can peel off and stick somewhere else, and nothing stops you sticking it on a different kind of value than before.<\/p>\n<p>Each value also has a type, and you can ask: <code>int<\/code> is a whole number, <code>float<\/code> is a number with a decimal point, <code>str<\/code> is text. The type decides what the operators mean. <code>3 * 2<\/code> is 6; <code>\"ab\" * 2<\/code> is <code>\"abab\"<\/code>. Neither is a mistake, which is exactly why a type you did not notice is dangerous.<\/p>"}, {"type": "code", "code": "count = 10\nprint(count, type(count))        # 10 <class 'int'>\n\ncount = count + 1                # read the right side first: 10 + 1\nprint(count)                     # 11\n\ncount = \"eleven\"                 # allowed; the label moved to a string\nprint(count, type(count))\n\n# Converting between types\nprint(float(\"19.5\") + float(\"20.1\"))   # 39.6  -- numbers now\nprint(int(\"42\") + 1)                   # 43\nprint(str(42) + \" rows\")               # '42 rows'\nprint(7 / 2, 7 // 2, 7 % 2)            # 3.5  3  1", "caption": "type() answers 'what am I holding?'. int(), float() and str() convert."}, {"type": "callout", "kind": "warn", "title": "int() will not round for you", "body": "int(\"19.5\") does not give you 19 or 20, it raises ValueError: invalid literal for int(). int() reads whole numbers only. For a decimal written as text, convert with float() first, and if you really want a whole number, round(float(\"19.5\")) says so out loud. Reading the error message is a skill worth building now: the last line of a traceback names the type of problem and is usually the only line you need."}, {"type": "prose", "html": "<p>One habit to start today: when you are unsure what a line produced, <code>print<\/code> it. Guessing is slower than checking, and it stays slower when the values are 40,000 rows read from a file instead of two numbers you typed.<\/p>\n<p>That habit pays off the moment you load real data. A column of numbers from a CSV file arrives as a list of strings; the empty cells arrive as <code>\"\"<\/code>; an identifier like <code>007<\/code> turns into <code>7<\/code> if you convert it carelessly. Every one of those is a type question. You now have the tools to ask it.<\/p>"}], "exercise": {"brief": "Write a function named to_fahrenheit that takes one argument: a temperature in Celsius written as text, like \"19.5\". Convert it to a number, convert that to Fahrenheit (multiply by 9, divide by 5, add 32) and return the result as a float. Negative values and \"0\" must work.", "starter": "def to_fahrenheit(celsius_text):\n    # your code here\n    return celsius_text\n", "solution": "def to_fahrenheit(celsius_text):\n    celsius = float(celsius_text)\n    return celsius * 9 / 5 + 32\n", "tests": [{"label": "freezing point", "expr": "to_fahrenheit(\"0\") == 32.0"}, {"label": "boiling point", "expr": "to_fahrenheit(\"100\") == 212.0"}, {"label": "negative reading", "expr": "to_fahrenheit(\"-40\") == -40.0"}, {"label": "decimal reading", "expr": "to_fahrenheit(\"37.5\") == 99.5"}, {"label": "returns a float, not text", "expr": "type(to_fahrenheit(\"20\")) is float"}]}}, {"id": "py-02", "track": "python", "order": 4, "title": "Strings and formatting", "blurb": "Two files call the same column \" Temp C \" and \"temp_c\", and until you fix that they will never line up.", "minutes": 14, "section": "Introduction", "objectives": ["Pull characters and substrings out of text with indexing and slicing", "Clean messy text with strip, lower, replace and split", "Build readable output with f-strings"], "sections": [{"type": "prose", "html": "<p>Here is one line as it actually comes out of a file:<\/p>\n<p><code>\"2024-03-01, roof-01 ,19.5\\n\"<\/code><\/p>\n<p>You want three things out of it: a date, a sensor name and a number. What you have is one long piece of text with stray spaces, commas holding it together and an invisible newline character on the end. Nothing about it is wrong. Text is simply the format the world ships data in, and the first stretch of any data job is unglamorous text surgery: trimming spaces, matching names that differ only in capitalisation, splitting a line into fields.<\/p>\n<p>Two tools do most of the work. <strong>Positions<\/strong> let you take a piece of a string. <strong>Methods<\/strong> are jobs a string can do for you, written as <code>value.job()<\/code>.<\/p>"}, {"type": "code", "code": "line = \"2024-03-01\"\n\nprint(len(line))      # 10 characters\nprint(line[0])        # '2'   -- counting starts at 0\nprint(line[4])        # '-'\nprint(line[-1])       # '1'   -- negative counts from the right\n\nprint(line[0:4])      # '2024'  -- from 0 up to but NOT including 4\nprint(line[5:7])      # '03'\nprint(line[:4])       # '2024'  -- start left out means 'from the beginning'\nprint(line[5:])       # '03-01' -- end left out means 'to the end'", "caption": "Index for one character, slice for a run of them. The end of a slice is excluded."}, {"type": "callout", "kind": "warn", "title": "A string method never changes the string", "body": "Strings cannot be edited in place. line[0] = \"X\" raises TypeError, and name.strip() does not clean name -- it hands back a new, clean string and leaves the original exactly as it was. The most common first-week bug in Python is a line like name.strip() sitting on its own, doing nothing visible. You have to catch the result: name = name.strip()."}, {"type": "code", "code": "raw = \"  Temp C \\n\"\n\nprint(repr(raw.strip()))        # 'Temp C'   -- spaces and newline gone\nprint(raw.strip().lower())      # 'temp c'\nprint(raw.strip().lower().replace(\" \", \"_\"))   # 'temp_c'\n\nprint(\"roof-01\".startswith(\"roof\"))   # True\nprint(\"ROOF-01\".lower() == \"roof-01\") # True\n\n# split cuts a string into a list of pieces\nrow = \"2024-03-01, roof-01 ,19.5\"\nfields = row.split(\",\")\nprint(fields)                   # ['2024-03-01', ' roof-01 ', '19.5']\nprint(fields[1].strip())        # 'roof-01'\nprint(float(fields[2]))         # 19.5", "caption": "Methods chain left to right: strip first, then lower, then replace."}, {"type": "prose", "html": "<p>The other half of the job is putting text back together, usually so a human can read it. Glue-and-convert works but reads badly: <code>\"mean \" + str(round(m, 2)) + \" from \" + str(n) + \" rows\"<\/code> is hard to write and harder to check.<\/p>\n<p>An <strong>f-string<\/strong> is a string with an <code>f<\/code> in front, where anything in curly braces is replaced by the value of that expression. You can also say how a number should be displayed: <code>{m:.2f}<\/code> means \"two decimal places\". That matters more than it sounds like. A mean of <code>19.499999999999996<\/code> and one of <code>19.50<\/code> are the same number, but only one of them tells you anything at a glance, and you will be reading these lines constantly once there is real data flowing past.<\/p>"}, {"type": "code", "code": "sensor = \"roof-01\"\nmean = 19.499999999999996\nrows = 1284\n\nprint(f\"{sensor}: mean {mean:.2f} over {rows} rows\")\n# roof-01: mean 19.50 over 1284 rows\n\nprint(f\"{rows / 2:.0f} rows per file\")   # expressions work inside braces\nprint(f\"{mean = :.3f}\")                  # handy while debugging", "caption": "f-strings: f in front, values in braces, optional :.2f to control decimals."}], "exercise": {"brief": "Column names arrive from different files in different shapes. Write a function named clean_label that takes one string and returns it trimmed of surrounding whitespace, lowercased, with every space replaced by an underscore. An empty string, and a string of nothing but spaces, must both come back as an empty string.", "starter": "def clean_label(text):\n    # your code here\n    return text\n", "solution": "def clean_label(text):\n    return text.strip().lower().replace(\" \", \"_\")\n", "tests": [{"label": "trims, lowercases and joins with underscore", "expr": "clean_label(\"  Temp C \") == \"temp_c\""}, {"label": "handles shouty labels", "expr": "clean_label(\"SENSOR ID\") == \"sensor_id\""}, {"label": "leaves an already clean label alone", "expr": "clean_label(\"temp_c\") == \"temp_c\""}, {"label": "empty string stays empty", "expr": "clean_label(\"\") == \"\""}, {"label": "nothing but spaces becomes empty", "expr": "clean_label(\"   \") == \"\""}, {"label": "single word", "expr": "clean_label(\" Date \") == \"date\""}]}}, {"id": "py-03", "track": "python", "order": 5, "title": "Lists, and the copy that wasn't", "blurb": "cleaned = readings looks like it makes a second list. It does not, and the original is now wrecked.", "minutes": 14, "section": "Introduction", "objectives": ["Build lists and reach into them with indexing and slicing", "Add items with append and extend, and know which one you want", "Spot when two names point at the same list, and copy on purpose"], "sections": [{"type": "prose", "html": "<p>You have a few thousand sensor readings in one variable and you want to try cleaning them up without losing the originals, so you write this:<\/p>\n<p><code>cleaned = readings<\/code><\/p>\n<p>Then you edit <code>cleaned<\/code>, go back to compare against <code>readings<\/code>, and find that <code>readings<\/code> changed too. There is no copy anywhere. There is one list with two names stuck on it.<\/p>\n<p>This is the single most expensive beginner mistake in data work, because it does not crash. Nothing turns red. You just quietly end up comparing a thing to itself, or feeding half-modified data forward and wondering why the numbers look strange. We will get to exactly why, but first, what a list is.<\/p>"}, {"type": "code", "code": "readings = [19.5, 20.1, 18.7, 21.0]\n\nprint(len(readings))     # 4\nprint(readings[0])       # 19.5\nprint(readings[-1])      # 21.0  -- last item\nprint(readings[1:3])     # [20.1, 18.7]  -- a new, smaller list\nprint(readings[:2])      # [19.5, 20.1]\n\nreadings[0] = 19.6       # lists CAN be edited in place; strings cannot\nprint(readings)          # [19.6, 20.1, 18.7, 21.0]\n\nprint(sum(readings) / len(readings))   # the mean\nprint(min(readings), max(readings))\nprint(sorted(readings))                # a new sorted list", "caption": "Indexing and slicing work exactly as they do on strings, position 0 first."}, {"type": "prose", "html": "<p>Strings were immutable: every method handed you a new string. Lists are the opposite, and that difference is the whole lesson. A list can be changed after it is made, so there are two sorts of operation and they look alike.<\/p>\n<ul>\n<li><code>readings.append(22.4)<\/code> adds <strong>one item<\/strong> to the end and returns nothing.<\/li>\n<li><code>readings.extend([22.4, 23.0])<\/code> adds <strong>each item<\/strong> of another list. <code>append<\/code> with a list would have added the list itself as a single nested item.<\/li>\n<li><code>a + b<\/code> builds a <strong>new<\/strong> list and leaves both alone.<\/li>\n<li><code>readings.sort()<\/code> rearranges the list in place and returns <code>None<\/code>; <code>sorted(readings)<\/code> leaves it alone and hands back a new list. <code>best = readings.sort()<\/code> gives you <code>None<\/code>, which is a bug you will write at least once.<\/li>\n<\/ul>\n<p>Building a list up with <code>append<\/code> is the pattern you will use most: start empty, loop over your raw data, append each value you managed to clean. A list of numbers is the shape data sits in before it goes anywhere else.<\/p>"}, {"type": "code", "code": "readings = [19.5, 20.1]\n\nreadings.append(18.7)\nprint(readings)                 # [19.5, 20.1, 18.7]\n\nreadings.append([1, 2])         # one item, which happens to be a list\nprint(readings)                 # [19.5, 20.1, 18.7, [1, 2]]\nprint(len(readings))            # 4, not 5\n\nreadings = [19.5, 20.1]\nreadings.extend([1, 2])         # each item separately\nprint(readings)                 # [19.5, 20.1, 1, 2]\n\nprint(readings.append(9))       # None  -- it changes the list, it returns nothing", "caption": "append adds one thing. extend adds each thing. Neither returns the list."}, {"type": "callout", "kind": "warn", "title": "b = a gives you one list with two names", "body": "Assignment never copies a list. It copies the label. After b = a, the names a and b refer to the same list in memory, so b.append(1) changes what a sees, and a[0] = 99 changes what b sees. To get a separate list, ask for one: b = a[:] or b = list(a) or b = a.copy(). The test for which situation you are in is the word is -- a is b asks 'the same list?', a == b only asks 'the same contents?'."}, {"type": "code", "code": "a = [1, 2, 3]\nb = a                  # NOT a copy\nb.append(4)\nprint(a)               # [1, 2, 3, 4]   <- a changed\nprint(a is b)          # True  -- one list, two names\n\na = [1, 2, 3]\nb = a[:]               # a real copy\nb.append(4)\nprint(a)               # [1, 2, 3]      <- untouched\nprint(b)               # [1, 2, 3, 4]\nprint(a is b)          # False\nprint(a == b)          # False here, but == only ever compares contents", "caption": "Same code, one character apart, completely different outcome."}], "exercise": {"brief": "Write a function named with_extra that takes a list and one extra value, and returns a NEW list holding the original items followed by the extra value. The list passed in must come back unchanged, so the caller can keep their original. An empty list must work.", "starter": "def with_extra(readings, extra):\n    # your code here\n    readings.append(extra)\n    return readings\n", "solution": "def with_extra(readings, extra):\n    out = readings[:]          # copy first, so the caller's list is safe\n    out.append(extra)\n    return out\n", "tests": [{"label": "adds the value to the end", "expr": "with_extra([1, 2], 3) == [1, 2, 3]"}, {"label": "works on an empty list", "expr": "with_extra([], 5) == [5]"}, {"label": "keeps duplicates", "expr": "with_extra([7, 7], 7) == [7, 7, 7]"}, {"label": "leaves the original list unchanged", "expr": "(lambda xs: with_extra(xs, 3) == [1, 2, 3] and xs == [1, 2])([1, 2])"}, {"label": "returns a different list, not the same one", "expr": "(lambda xs: with_extra(xs, 1) is not xs)([0])"}]}}, {"id": "py-04", "track": "python", "order": 6, "title": "Loops and comprehensions", "blurb": "Forty thousand readings need converting. You are not going to write forty thousand lines.", "minutes": 15, "section": "Introduction", "objectives": ["Loop over a list with for, and over positions with range", "Get the position and the value together with enumerate", "Write a list comprehension, and read one in someone else's code"], "sections": [{"type": "prose", "html": "<p>Converting one reading from text to a number took one line. A file has 40,000 of them. Copying that line 40,000 times is not a joke option: you cannot type it, you could not fix a mistake in it, and the number of rows changes next week anyway.<\/p>\n<p>A <strong>for loop<\/strong> is the fix, and it is worth reading the syntax out loud as English rather than as code. <code>for value in readings:<\/code> means \"for each value in readings, do the indented block\". The indented block runs once per item, with the name <code>value<\/code> pointing at a different item each time round. Python uses the indentation itself to decide what is inside the loop and what comes after, so it is not decoration.<\/p>\n<p>Almost everything you will do with data is this shape: take every row, do one thing to it, collect the results. Get comfortable here and the rest is detail.<\/p>"}, {"type": "code", "code": "raw = [\"19.5\", \"20.1\", \"18.7\"]\n\nfor text in raw:\n    print(text, \"->\", float(text))\n\n# The pattern you will use constantly: start empty, append as you go.\nnumbers = []\nfor text in raw:\n    numbers.append(float(text))\n\nprint(numbers)                         # [19.5, 20.1, 18.7]\nprint(sum(numbers) / len(numbers))     # 19.433333333333334\n\n# range gives you a run of whole numbers, 0 up to but not including the end\nfor i in range(3):\n    print(i)                           # 0, 1, 2\n\nprint(list(range(2, 6)))               # [2, 3, 4, 5]", "caption": "Loop, do one thing per item, append the result. Learn this shape by heart."}, {"type": "prose", "html": "<p>Sometimes the value is not enough and you need to know <em>where<\/em> you are: which row of the file failed, which position in the list holds the maximum. The clumsy way is <code>for i in range(len(readings)):<\/code> and then <code>readings[i]<\/code> everywhere. It works, it is noisy, and it is easy to get wrong by one.<\/p>\n<p><code>enumerate<\/code> hands you both at once: <code>for i, value in enumerate(readings):<\/code> gives the position in <code>i<\/code> and the item in <code>value<\/code>. Use it whenever you need the position, and the plain <code>for value in readings:<\/code> whenever you do not. \"Row 9,217 could not be read\" is a far more useful thing to print than \"a row could not be read\".<\/p>\n<p>Now look at the collect-into-a-new-list pattern again. Three lines, every time, with the only interesting part being the middle one. It is so common that Python has a one-line form for it, the <strong>list comprehension<\/strong>: <code>[float(t) for t in raw]<\/code>. Same loop, same result, read right to left: for each <code>t<\/code> in <code>raw<\/code>, put <code>float(t)<\/code> in the new list. You can also filter as you go by adding <code>if<\/code> on the end, which keeps only the items that pass.<\/p>\n<p>Comprehensions are everywhere in real data code, so you need to be able to read one even before you are confident writing them. Keep them to one line doing one simple thing. If it needs two conditions, a nested loop and a function call, write the plain loop and let the next person understand it.<\/p>"}, {"type": "code", "code": "readings = [19.5, 20.1, 18.7, 21.0]\n\nfor i, value in enumerate(readings):\n    print(f\"row {i}: {value}\")\n\n# enumerate can start counting at 1, which suits file lines\nfor line_no, value in enumerate(readings, start=1):\n    print(f\"line {line_no} holds {value}\")\n\n# Filtering with a plain loop\nwarm = []\nfor value in readings:\n    if value > 19:\n        warm.append(value)\nprint(warm)              # [19.5, 20.1, 21.0]", "caption": "enumerate when you need the position. Otherwise do not ask for it."}, {"type": "callout", "kind": "warn", "title": "Do not add to or delete from a list while you loop over it", "body": "A for loop walks the list by position. If you delete an item inside the loop, everything after it shifts down one and the loop skips the next item, so removing bad rows this way silently leaves some behind. If you append inside the loop, you may never reach the end. Build a new list instead -- that is what the append pattern and the comprehension are both for."}, {"type": "code", "code": "raw = [\"19.5\", \"20.1\", \"18.7\"]\n\n# The three-line loop...\nnumbers = []\nfor text in raw:\n    numbers.append(float(text))\n\n# ...and the same thing as a comprehension\nnumbers = [float(text) for text in raw]\nprint(numbers)                                  # [19.5, 20.1, 18.7]\n\n# With a filter on the end\nwarm = [n for n in numbers if n > 19]\nprint(warm)                                     # [19.5, 20.1]\n\n# It does not have to be a function call\ndoubled = [n * 2 for n in numbers]\nlabels = [f\"sensor-{i}\" for i in range(3)]\nprint(doubled, labels)", "caption": "Read a comprehension as: new list of EXPRESSION, for each ITEM in SEQUENCE, if CONDITION."}], "exercise": {"brief": "Write a function named running_total that takes a list of numbers and returns a new list of the same length, where each item is the total of everything up to and including that position. running_total([1, 2, 3]) is [1, 3, 6]. An empty list returns an empty list, and a single item returns a list holding just that item.", "starter": "def running_total(xs):\n    out = []\n    # your code here\n    return out\n", "solution": "def running_total(xs):\n    out = []\n    total = 0\n    for x in xs:\n        total = total + x\n        out.append(total)\n    return out\n", "tests": [{"label": "adds up as it goes", "expr": "running_total([1, 2, 3]) == [1, 3, 6]"}, {"label": "empty list", "expr": "running_total([]) == []"}, {"label": "single item", "expr": "running_total([5]) == [5]"}, {"label": "handles negatives", "expr": "running_total([2, -2, 2]) == [2, 0, 2]"}, {"label": "zeros do not shorten the result", "expr": "running_total([0, 0, 0]) == [0, 0, 0]"}, {"label": "leaves the input alone", "expr": "(lambda xs: running_total(xs) == [1, 3] and xs == [1, 2])([1, 2])"}]}}, {"id": "py-05", "track": "python", "order": 7, "title": "Conditionals and truthiness", "blurb": "A sensor reports 0, your code calls it missing data, and you never find out because nothing crashed.", "minutes": 14, "section": "Introduction", "objectives": ["Branch with if, elif and else", "Combine conditions with and, or and not", "Name the values Python treats as false, and say why if x: can silently drop a real zero"], "sections": [{"type": "prose", "html": "<p>You are filtering rows and you want to skip the ones where the sensor reported nothing. So you write <code>if value:<\/code> and handle the rest. It looks right and it reads nicely in English.<\/p>\n<p>Then a sensor on a cold night reports <code>0<\/code>. Python treats <code>0<\/code> as false, your condition fails, and a perfectly good measurement is thrown away as missing. No error, no warning, just a slightly wrong dataset and an average that is slightly too high. The same thing happens to the empty string and the empty list.<\/p>\n<p>\"Missing\" and \"zero\" are different facts about the world, and real datasets contain both. Keeping them apart is a judgement call you have to make deliberately, which means you need to know exactly what Python considers true.<\/p>"}, {"type": "code", "code": "temperature = 19.5\n\nif temperature > 30:\n    print(\"hot\")\nelif temperature > 15:          # only checked if the first was False\n    print(\"mild\")\nelse:\n    print(\"cold\")\n\n# The comparisons\nprint(3 == 3, 3 != 4)           # True True   -- == compares, = assigns\nprint(3 < 4, 3 >= 3)            # True True\nprint(\"abc\" == \"ABC\")           # False -- text comparison is case sensitive\n\n# Python lets you chain a range check, and it reads the way you would say it\nif 0 <= temperature <= 100:\n    print(\"inside the plausible range\")", "caption": "if / elif / else. Only the first branch that is True runs."}, {"type": "prose", "html": "<p>Conditions combine with three words. <code>and<\/code> is true when both sides are; <code>or<\/code> is true when either side is; <code>not<\/code> flips a condition over.<\/p>\n<p>One detail of <code>and<\/code> and <code>or<\/code> is load bearing rather than trivia: Python stops as soon as it knows the answer. In <code>if readings and readings[0] > 19:<\/code>, if <code>readings<\/code> is empty the left side is already false, so the right side is never evaluated and <code>readings[0]<\/code> never runs. Written the other way round that same line crashes on an empty list with IndexError. This \"check it exists, then look inside it\" order is a pattern you will write constantly once data is involved, because the first thing real data does is hand you something empty.<\/p>"}, {"type": "code", "code": "readings = []\n\n# Safe: the right side is only reached if the left side is True\nif readings and readings[0] > 19:\n    print(\"first reading is warm\")\nelse:\n    print(\"nothing to check\")\n\n# Crashes on an empty list -- IndexError\n# if readings[0] > 19 and readings:\n\nvalue = 19.5\nsensor = \"roof-01\"\n\nif value > 15 and sensor.startswith(\"roof\"):\n    print(\"warm reading from the roof\")\n\nif not sensor.startswith(\"ground\"):\n    print(\"not a ground sensor\")", "caption": "and stops at the first False, or stops at the first True. Order your checks accordingly."}, {"type": "callout", "kind": "warn", "title": "Empty is false, and so is zero", "body": "if x: does not ask 'does x exist?'. It asks 'is x truthy?', and Python counts all of these as false: False, None, 0, 0.0, the empty string \"\", the empty list [], the empty dict {} and the empty set. Everything else is true, including \"0\", \"False\" and [0], which are all non-empty. So if count: skips a count of zero, and if name: skips a name that is the empty string. When you mean 'was a value supplied at all?', write if x is not None:. Use is None and is not None for that check, never == None."}, {"type": "code", "code": "for value in [5, 0, 0.0, \"\", \"0\", [], [0], None]:\n    print(repr(value), \"-> truthy?\", bool(value))\n\n# 5 -> True, 0 -> False, 0.0 -> False, '' -> False,\n# '0' -> True, [] -> False, [0] -> True, None -> False\n\ncount = 0\n\nif count:\n    print(\"got a count\")        # never runs -- the bug\nelse:\n    print(\"looks missing\")      # ...but 0 is a real answer\n\nif count is not None:\n    print(\"a count was supplied, and it is\", count)   # this is what we meant\n\n# The useful shorthand, used on purpose: 'if the list has anything in it'\nreadings = []\nif not readings:\n    print(\"no readings to process\")", "caption": "The shorthand is fine when you mean 'is it empty?'. It is wrong when you mean 'is it missing?'."}], "exercise": {"brief": "Write a function named label_reading that takes one value and returns the string \"missing\" if the value is None or the empty string, \"zero\" if the value is equal to 0, and \"ok\" for anything else. A reading of 0 or 0.0 is real data, not missing data.", "starter": "def label_reading(value):\n    if not value:\n        return \"missing\"\n    return \"ok\"\n", "solution": "def label_reading(value):\n    if value is None or value == \"\":\n        return \"missing\"\n    if value == 0:\n        return \"zero\"\n    return \"ok\"\n", "tests": [{"label": "a normal reading", "expr": "label_reading(5) == \"ok\""}, {"label": "zero is real data", "expr": "label_reading(0) == \"zero\""}, {"label": "0.0 is real data too", "expr": "label_reading(0.0) == \"zero\""}, {"label": "None is missing", "expr": "label_reading(None) == \"missing\""}, {"label": "an empty cell is missing", "expr": "label_reading(\"\") == \"missing\""}, {"label": "negatives are fine", "expr": "label_reading(-3) == \"ok\""}]}}, {"id": "py-06", "track": "python", "order": 8, "title": "Functions, and the default that remembers", "blurb": "The same cleanup code is pasted in three places and you have fixed the bug in one of them.", "minutes": 15, "section": "Introduction", "objectives": ["Write a function with def, arguments, defaults and return", "Explain what a function can and cannot see from outside it", "Avoid the mutable default argument bug"], "sections": [{"type": "prose", "html": "<p>Five lines that strip a label, convert a number and skip the blanks. You needed them for the training file, so you pasted them in. Then for the test file. Then for the file a colleague sent. Now you notice the first version mishandles a minus sign, and there are three copies to find, two of which have drifted.<\/p>\n<p>A function is the fix: a named block of code with inputs and one output, written once, fixed once. That is the practical argument. The deeper one is that a function is a thing you can <em>test<\/em> -- you can call <code>clean(\"  -3.5 \")<\/code> and check the answer without running your whole script -- and code you can test is code you can believe.<\/p>\n<p>This matters later for a specific reason. Whatever cleanup you do to the data you build a model on has to be done identically to every new piece of data you ever feed it. One function, called twice, is how you get that for free. Two pasted copies is how people end up with results that cannot be reproduced.<\/p>"}, {"type": "code", "code": "def mean(numbers):\n    return sum(numbers) / len(numbers)\n\nprint(mean([19.5, 20.1, 18.7]))\n\n# Arguments can have defaults, which makes them optional at the call site\ndef clean(text, lower=True):\n    text = text.strip()\n    if lower:\n        text = text.lower()\n    return text\n\nprint(clean(\"  Roof-01 \"))              # 'roof-01'\nprint(clean(\"  Roof-01 \", False))       # 'Roof-01'\nprint(clean(\"  Roof-01 \", lower=False)) # same, but you can read it\n\n# return ends the function immediately, so an early return is a clean guard\ndef safe_mean(numbers):\n    if not numbers:\n        return 0.0\n    return sum(numbers) / len(numbers)\n\nprint(safe_mean([]))                    # 0.0, instead of ZeroDivisionError", "caption": "def NAME(ARGUMENTS): then an indented body, and return hands a value back."}, {"type": "prose", "html": "<p>Two things trip people up here, and both are about what comes out and what goes in.<\/p>\n<p><strong>return is not print.<\/strong> <code>print<\/code> shows a value to a human and produces nothing. <code>return<\/code> hands a value back to the code that called the function. A function that prints its answer instead of returning it gives you <code>None<\/code>, and <code>None + 1<\/code> is a TypeError three lines later. If you want to use the answer, return it.<\/p>\n<p><strong>What happens inside stays inside.<\/strong> Names created in a function body are local: they exist while the function runs and then vanish. A function can read a variable from outside, but assigning to a name inside the function just makes a new local one -- it does not reach out and change the outer value. This is a feature. It is why you can call <code>mean()<\/code> from anywhere without wondering what it will quietly break.<\/p>\n<p>The exception is the one thing you already met in lesson 3. If you pass a <em>list<\/em> in and call <code>.append<\/code> on it, you are modifying the caller's list, because the argument is another name for the same list. Scope protects names, not the objects they point at.<\/p>"}, {"type": "code", "code": "total = 100\n\ndef add_one(n):\n    total = n + 1        # a NEW local name, unrelated to the outer total\n    return total\n\nprint(add_one(5))        # 6\nprint(total)             # 100  -- untouched\n\ndef forgot_to_return(numbers):\n    print(sum(numbers))  # shows it...\n\nresult = forgot_to_return([1, 2])\nprint(result)            # None  -- ...but gives nothing back\n\ndef mutates(xs):\n    xs.append(99)        # no return, and yet the caller's list changed\n\nmine = [1]\nmutates(mine)\nprint(mine)              # [1, 99]", "caption": "Assignment inside a function is local. Mutating a passed-in list is not."}, {"type": "callout", "kind": "warn", "title": "def f(x=[]) is one list, shared by every call", "body": "A default value is evaluated once, when the def line runs -- not once per call. So a default of [] creates a single list that every call without an argument then shares, and anything appended to it is still there on the next call. Call the function three times and you get [1], [1, 2], [1, 2, 3]. The fix is always the same shape: default to None, and build the real list inside the function body. The same applies to {} and to any other value that can be changed in place."}, {"type": "code", "code": "def broken(value, bucket=[]):      # the default list is made ONCE\n    bucket.append(value)\n    return bucket\n\nprint(broken(1))      # [1]\nprint(broken(2))      # [1, 2]      <- the 1 is still there\nprint(broken(3))      # [1, 2, 3]\n\ndef fixed(value, bucket=None):\n    if bucket is None:\n        bucket = []                # a fresh list on every call\n    bucket.append(value)\n    return bucket\n\nprint(fixed(1))       # [1]\nprint(fixed(2))       # [2]\nprint(fixed(3))       # [3]\nprint(fixed(4, [0]))  # [0, 4]      -- still works when you pass one in", "caption": "Same function twice. The only difference is where the empty list is created."}], "exercise": {"brief": "Write a function named collect that takes a value and an optional list. If a list is given, append the value to that list and return it. If no list is given, start a fresh empty list each time, append the value and return it. Calling collect twice with no list must give two independent one-item lists, and a value of 0 must work.", "starter": "def collect(value, bucket=[]):\n    bucket.append(value)\n    return bucket\n", "solution": "def collect(value, bucket=None):\n    if bucket is None:\n        bucket = []\n    bucket.append(value)\n    return bucket\n", "tests": [{"label": "starts a new list when none is given", "expr": "collect(1) == [1]"}, {"label": "nothing carries over between calls", "expr": "collect(1) == [1] and collect(2) == [2]"}, {"label": "appends to a list you pass in", "expr": "(lambda xs: collect(3, xs) == [1, 2, 3])([1, 2])"}, {"label": "returns the very list you passed in", "expr": "(lambda xs: collect(3, xs) is xs)([1, 2])"}, {"label": "a value of 0 is still collected", "expr": "collect(0) == [0]"}, {"label": "an empty list passed in works", "expr": "collect(9, []) == [9]"}]}}, {"id": "py-07", "track": "python", "order": 9, "title": "Dictionaries and sets", "blurb": "Counting how often each label appears, and why asking a list \"is this in you?\" forty thousand times is the slow way.", "minutes": 14, "section": "Introduction", "objectives": ["Store and look up values by key in a dictionary", "Avoid KeyError with .get, and iterate over keys, values and items", "Choose a set when you need uniqueness or a fast membership test"], "sections": [{"type": "prose", "html": "<p>You have a column of labels -- <code>[\"cat\", \"dog\", \"cat\", \"bird\", \"cat\"]<\/code> -- and you want to know how many of each. A list cannot answer that directly. A list knows about positions, and \"cat\" is not a position.<\/p>\n<p>What you want is a lookup table: a label on one side, a count on the other. That is a <strong>dictionary<\/strong>, and it is probably the data structure you will reach for most. It stores pairs, and it finds a value by its key immediately, no matter how many pairs there are. A row of a spreadsheet is naturally a dict too -- <code>{\"date\": \"2024-03-01\", \"sensor\": \"roof-01\", \"temp\": 19.5}<\/code> -- and reading <code>row[\"temp\"]<\/code> beats remembering that temperature was the third field.<\/p>\n<p>Counting labels is not a toy example either. Before you train anything, you check how many examples you have of each class, because a dataset that is 95% one label will produce a model that looks excellent and has learned nothing.<\/p>"}, {"type": "code", "code": "row = {\"date\": \"2024-03-01\", \"sensor\": \"roof-01\", \"temp\": 19.5}\n\nprint(row[\"sensor\"])            # 'roof-01'  -- square brackets, like a list,\n                                #  but with a key instead of a position\nprint(len(row))                 # 3\n\nrow[\"temp\"] = 19.6              # change a value\nrow[\"unit\"] = \"C\"               # add a new pair just by assigning\nprint(row)\n\nprint(\"temp\" in row)            # True   -- 'in' checks KEYS\nprint(\"19.6\" in row)            # False  -- not values\ndel row[\"unit\"]\n\ncounts = {}                     # an empty dictionary\ncounts[\"cat\"] = 1\nprint(counts)                   # {'cat': 1}", "caption": "Keys are usually strings. Values can be anything, including lists and dicts."}, {"type": "callout", "kind": "warn", "title": "A missing key raises KeyError, unless you ask nicely", "body": "row[\"humidity\"] on a dict with no humidity key stops your script with KeyError: 'humidity'. Real data has gaps, so use row.get(\"humidity\") to get None instead of a crash, or row.get(\"humidity\", 0) to choose your own fallback. That second form gives you the counting idiom that turns up in every data script: counts[label] = counts.get(label, 0) + 1 reads as 'the count so far, or zero if this is the first time, plus one'."}, {"type": "code", "code": "labels = [\"cat\", \"dog\", \"cat\", \"bird\", \"cat\"]\n\ncounts = {}\nfor label in labels:\n    counts[label] = counts.get(label, 0) + 1\n\nprint(counts)                   # {'cat': 3, 'dog': 1, 'bird': 1}\n\n# Three ways to loop over a dict\nfor key in counts:              # keys, which is the default\n    print(key)\n\nfor value in counts.values():\n    print(value)\n\nfor key, value in counts.items():          # both at once -- the useful one\n    print(f\"{key}: {value}\")\n\nprint(counts.get(\"fish\"))       # None  -- no crash\nprint(counts.get(\"fish\", 0))    # 0     -- usually what you want", "caption": "The counting loop. Four lines, and you will write it more than any other."}, {"type": "prose", "html": "<p>A <strong>set<\/strong> is the other half of this lesson: a collection with no duplicates and no order. <code>{\"cat\", \"dog\"}<\/code>, or <code>set(labels)<\/code> to collapse a list down to the distinct values in it. It is the one-line answer to \"which labels appear at all?\" and to \"give me the unique sensor IDs\".<\/p>\n<p>The reason to care goes beyond deduplication. When you ask <code>if x in some_list<\/code>, Python compares <code>x<\/code> against the items one at a time until it finds a match. For a list of 40,000 IDs that is up to 40,000 comparisons, and doing that check once per row means 40,000 x 40,000 comparisons, which is slow enough to look like your program has hung. A set and a dict do not search: they jump straight to where the item would be, in about the same time whether they hold ten items or ten million. Converting the list you are searching into a set first is the single easiest speed-up in beginner data code.<\/p>\n<p>The trade-off is what you give up. Sets have no positions, so there is no <code>s[0]<\/code> and no \"first\" item, and they silently discard duplicates -- which is a bug if you were counting.<\/p>"}, {"type": "code", "code": "labels = [\"cat\", \"dog\", \"cat\", \"bird\", \"cat\"]\n\nunique = set(labels)\nprint(unique)                   # {'cat', 'dog', 'bird'}  -- order not guaranteed\nprint(len(unique))              # 3  -- how many distinct labels\n\nallowed = {\"cat\", \"dog\"}\nprint(\"cat\" in allowed)         # True   -- immediate, however big the set\nprint(\"bird\" in allowed)        # False\n\n# Keeping only the rows whose label is allowed\nkept = [label for label in labels if label in allowed]\nprint(kept)                     # ['cat', 'dog', 'cat', 'cat']\n\n# Comparing two collections\nprint(unique - allowed)         # {'bird'}  -- in the data, not in the allowed list\nprint(unique & allowed)         # {'cat', 'dog'}  -- in both\n\ns = set()                       # empty set. {} would give you an empty dict.\ns.add(\"cat\")\ns.add(\"cat\")\nprint(s, len(s))                # {'cat'} 1", "caption": "set(list) to dedupe, 'in' to test membership fast, - and & to compare."}], "exercise": {"brief": "Write a function named count_labels that takes a list of strings and returns a dictionary mapping each label to the number of times it appears. An empty list returns an empty dictionary, and a list where every item is the same returns a single key.", "starter": "def count_labels(labels):\n    counts = {}\n    # your code here\n    return counts\n", "solution": "def count_labels(labels):\n    counts = {}\n    for label in labels:\n        counts[label] = counts.get(label, 0) + 1\n    return counts\n", "tests": [{"label": "counts repeats", "expr": "count_labels([\"cat\", \"dog\", \"cat\"]) == {\"cat\": 2, \"dog\": 1}"}, {"label": "empty list gives an empty dict", "expr": "count_labels([]) == {}"}, {"label": "single item", "expr": "count_labels([\"cat\"]) == {\"cat\": 1}"}, {"label": "all duplicates collapse to one key", "expr": "count_labels([\"cat\", \"cat\", \"cat\"]) == {\"cat\": 3}"}, {"label": "every label appears once", "expr": "count_labels([\"a\", \"b\", \"c\"]) == {\"a\": 1, \"b\": 1, \"c\": 1}"}, {"label": "counts the empty string like any other label", "expr": "count_labels([\"\", \"\"]) == {\"\": 2}"}]}}, {"id": "py-08", "track": "python", "order": 10, "title": "Files and errors", "blurb": "Row 9,217 is blank, the script dies after twenty seconds, and a bare except hides which of the two problems you actually have.", "minutes": 15, "section": "Introduction", "objectives": ["Read a text file line by line with open and with", "Catch the specific error you expect using try and except", "Say why a bare except makes a bug harder to find, not easier"], "sections": [{"type": "prose", "html": "<p>Your script reads a file of 40,000 readings. It runs for twenty seconds, then stops with <code>ValueError: could not convert string to float: ''<\/code>. Somewhere in there is a blank cell. You do not know which row, you have no results, and running it again will do exactly the same thing.<\/p>\n<p>This is the normal condition of real data, not bad luck. Files have blank cells, text where numbers should be, a header row you forgot about, and occasionally they are not where you said they were. So reading data is never just reading data: it is deciding, in advance, what your program does when a row cannot be read. Skip it and count how many you skipped? Substitute something? Stop, because a broken file means broken results? All three are legitimate. Having no answer is not.<\/p>"}, {"type": "code", "code": "# 'with' opens the file and closes it again when the block ends,\n# even if something goes wrong inside.\nwith open(\"readings.txt\") as f:\n    for line in f:\n        print(line.strip())        # each line arrives with a newline on the end\n\n# Everything at once, when the file is small\nwith open(\"readings.txt\") as f:\n    text = f.read()\n\nwith open(\"readings.txt\") as f:\n    lines = f.read().splitlines()  # a list of lines, newlines already gone\n\n# Writing. 'w' empties an existing file first; 'a' appends to it.\nwith open(\"clean.txt\", \"w\") as f:\n    f.write(\"19.5\\n\")", "caption": "Always open files with 'with'. Looping over the file gives you one line at a time."}, {"type": "prose", "html": "<p>When Python cannot do what you a
